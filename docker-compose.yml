# This docker-compose file is meant for local development!
# See readme.md

services:
  frontend-nx:
    container_name: eduhub-frontend-nx
    ports:
      - "5000:4200"
    build:
      context: ./frontend-nx
      dockerfile: Dockerfile-dev
    # uncomment this to disable automatic yarn dev on frontend startup
    # command: tail -F anything
    volumes:
      - ./frontend-nx:/opt/app
    depends_on:
      - hasura
      - keycloak
    environment:
      NEXT_PUBLIC_HELP_DOCS_URL: https://opencampus.gitbook.io/faq/
      NEXT_PUBLIC_STORAGE_BUCKET_URL: ${GITPOD_WORKSPACE_URL:-http://localhost}:4001/emulated-bucket
      NEXT_PUBLIC_ENVIRONMENT: development
      NEXT_PUBLIC_MATRIX_ELEMENT_CLIENT_URL: ${NEXT_PUBLIC_MATRIX_ELEMENT_CLIENT_URL:-}
      MM_URL: ${MM_URL:-https://chat.opencampus.sh}
      # Enable file watching in Docker environment
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      # Fix IPv6 localhost resolution for image loading
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      # Hasura configuration
      HASURA_ADMIN_SECRET: myadminsecretkey
      GRAPHQL_URI: http://hasura:8080/v1/graphql
      # Optional for local dev; required to encrypt Ghost newsletter credentials (see .env.example)
      GHOST_NEWSLETTER_CREDENTIALS_ENCRYPTION_KEY: ${GHOST_NEWSLETTER_CREDENTIALS_ENCRYPTION_KEY:-}

  node_functions:
    container_name: eduhub-node-functions
    image: node:22-bullseye
    user: "node"
    working_dir: /functions
    volumes:
      - ./functions:/functions
      - ./backend/init.d/file_storage:/home/node/www/emulated-bucket
    ports:
      - "42000-42024:42000-42024"
      - "4001:4001"
    command: ["sh", "/functions/start-node.sh"]
    environment:
      ENVIRONMENT: development
      EMULATE_EMAIL: "1"
      STORAGE_PORT: 4001
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_USER: admin
      KEYCLOAK_PW: admin
      HASURA_ENDPOINT: http://hasura:8080/v1/graphql
      HASURA_ADMIN_SECRET: myadminsecretkey
      HASURA_CLOUD_FUNCTION_SECRET: test1234
      LIBRARY_PATH: "../lib/cloud-storage.js"
      FORMBRICKS_API_KEY: ${FORMBRICKS_API_KEY:-}
      FORMBRICKS_API_URL: ${FORMBRICKS_API_URL:-https://app.formbricks.com}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      MATRIX_HOMESERVER_URL: ${MATRIX_HOMESERVER_URL:-}
      MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME:-}
      MATRIX_ELEMENT_CLIENT_URL: ${MATRIX_ELEMENT_CLIENT_URL:-}
      MATRIX_MAIN_SPACE_ID: ${MATRIX_MAIN_SPACE_ID:-}
      MATRIX_ADMIN_USER_ID: ${MATRIX_ADMIN_USER_ID:-}
      MATRIX_ADMIN_ACCESS_TOKEN: ${MATRIX_ADMIN_ACCESS_TOKEN:-}
      FRONTEND_URL: http://localhost:5000
      STORAGE_BUCKET_PUBLIC_URL: ${GITPOD_WORKSPACE_URL:-http://localhost}:4001/emulated-bucket
      # Optional for local dev; required to encrypt Ghost newsletter credentials (see .env.example)
      GHOST_NEWSLETTER_CREDENTIALS_ENCRYPTION_KEY: ${GHOST_NEWSLETTER_CREDENTIALS_ENCRYPTION_KEY:-}

  python_functions:
    container_name: eduhub-python-functions
    build:
      context: ./functions
      dockerfile: Dockerfile
    working_dir: /functions
    volumes:
      - ./functions:/functions
      - ./backend/init.d/file_storage:/home/node/www/emulated-bucket
    ports:
      - "42025:42025"
      - "42026:42026"
    command: sh -c "pip install -r /functions/apiProxy/requirements.txt && pip install -r /functions/callPythonFunction/requirements.txt && /functions/start-python.sh"
    environment:
      ENVIRONMENT: development
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_USER: admin
      KEYCLOAK_PW: admin
      HASURA_ENDPOINT: http://hasura:8080/v1/graphql
      JWT_ISSUER: http://keycloak:8080/realms/edu-hub
      JWT_JWKS_URI: http://keycloak:8080/realms/edu-hub/protocol/openid-connect/certs
      JWT_AUDIENCE: hasura
      HASURA_ADMIN_SECRET: myadminsecretkey
      HASURA_CLOUD_FUNCTION_SECRET: test1234
      BUCKET_NAME: emulated-bucket
      LOCAL_STORAGE_PORT: 4001
      # From repo-root .env (optional; see .env.example → Python serverless functions)
      ZOOM_API_KEY: ${ZOOM_API_KEY:-}
      ZOOM_API_SECRET: ${ZOOM_API_SECRET:-}
      ZOOM_ACCOUNT_ID: ${ZOOM_ACCOUNT_ID:-}
      ZOOM_HTTP_TIMEOUT_SEC: ${ZOOM_HTTP_TIMEOUT_SEC:-}
      LMS_URL: ${LMS_URL:-}
      LMS_USER: ${LMS_USER:-}
      LMS_PASSWORD: ${LMS_PASSWORD:-}
      LMS_ATTENDANCE_SURVEY_ID: ${LMS_ATTENDANCE_SURVEY_ID:-}
      MM_URL: ${MM_URL:-}
      MM_TOKEN: ${MM_TOKEN:-}
      

  hasura:
    container_name: eduhub-hasura
    restart: on-failure
    build:
      context: ./backend/
      dockerfile: Dockerfile-dev
    ports:
      - "8080:8080"
    depends_on:
      - db_hasura
      - keycloak
    environment:
      HASURA_CLOUD_FUNCTION_SECRET: test1234
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:postgrespassword@db_hasura:5432/postgres
      HASURA_GRAPHQL_ENABLE_CONSOLE: "false" # set to "false" to disable console, the console has to run on the host for some technical reasons, it is very hard to get it to run from inside the container: https://github.com/hasura/graphql-engine/issues/2824
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      HASURA_GRAPHQL_LOG_LEVEL: warn
      HASURA_GRAPHQL_ADMIN_SECRET: myadminsecretkey
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: anonymous
      HASURA_GRAPHQL_EXPERIMENTAL_FEATURES: inherited_roles
      HASURA_GRAPHQL_JWT_SECRET: '{"jwk_url": "http://keycloak:8080/realms/edu-hub/protocol/openid-connect/certs"}'

      HASURA_BUCKET: emulated-bucket
      CLOUD_FUNCTION_LINK_SEND_MAIL: "http://node_functions:42019"
      CLOUD_FUNCTION_LINK_SEND_QUESTIONAIRES: "http://node_functions:42024"
      CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION: "http://node_functions:42022"
      CLOUD_FUNCTION_LINK_NODE_PAYMENTS: "http://node_functions:42021"
      CLOUD_FUNCTION_LINK_KEYCLOAK_ADMIN: "http://node_functions:42001"
      CLOUD_FUNCTION_LINK_CALL_PYTHON_FUNCTION: "http://python_functions:42025"
    volumes:
      - ./backend:/hasura
      - ./backend/migrations:/hasura-migrations
      - ./backend/metadata:/hasura-metadata
      - ./backend/seeds:/hasura-seeds
      - ./backend/seeds/default:/hasura/seeds/default

  db_hasura:
    container_name: eduhub-db_hasura
    image: postgres:12
    environment:
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - ./backend/init.d:/docker-entrypoint-initdb.d:rw

  keycloak:
    container_name: eduhub-keycloak
    build:
      context: ./keycloak/
      dockerfile: Dockerfile-dev
    entrypoint: ["/bin/sh", "-c"]
    command:
      # --optimized reuses the augmentation baked into the image (see
      # Dockerfile-dev), skipping the ~90s Quarkus build on every startup.
      # The SPI theme-cache flags keep live theme reloading that `start-dev`
      # used to provide automatically.
      - >-
        unset KC_BOOTSTRAP_ADMIN_USERNAME KC_BOOTSTRAP_ADMIN_PASSWORD &&
        /opt/keycloak/bin/kc.sh import --optimized --file /opt/keycloak/data/import/master.json --override true &&
        exec /opt/keycloak/bin/kc.sh start --optimized --import-realm --spi-theme-cache-themes=false --spi-theme-cache-templates=false
    ports:
      - 28080:8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_HOST: "0.0.0.0"
    volumes:
      - ./keycloak/imports-dev/master.json:/opt/keycloak/data/import/master.json
      - ./keycloak/imports-dev/edu-hub.json:/opt/keycloak/data/import/edu-hub.json
      - ./keycloak/imports:/imports
      - ./keycloak/themes/opencampus:/opt/keycloak/themes/opencampus
      - ./keycloak/themes/edu-hub:/opt/keycloak/themes/edu-hub
      - ./keycloak/disable-theme-cache.cli:/opt/keycloak/startup-scripts/disable-theme-cache.cli
