name: Auto-close issues moved to Done (Projects v2)

on:
  issues:
    types: [opened, closed, reopened]
  pull_request:
    types: [opened, closed, reopened]

jobs:
  check-project-status:
    runs-on: ubuntu-latest
    steps:
      - name: Check if issue/PR is in Done column
        uses: actions/github-script@v9
        with:
          script: |
            const query = `
              fragment ProjectFields on ProjectV2Item {
                id
                project {
                  title
                }
                fieldValues(first: 8) {
                  nodes {
                    ... on ProjectV2ItemFieldTextValue {
                      text
                      field {
                        ... on ProjectV2FieldCommon {
                          name
                        }
                      }
                    }
                    ... on ProjectV2ItemFieldSingleSelectValue {
                      name
                      field {
                        ... on ProjectV2FieldCommon {
                          name
                        }
                      }
                    }
                  }
                }
              }

              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issueOrPullRequest(number: $number) {
                    ... on Issue {
                      projectItems(first: 20) {
                        nodes {
                          ...ProjectFields
                        }
                      }
                    }
                    ... on PullRequest {
                      projectItems(first: 20) {
                        nodes {
                          ...ProjectFields
                        }
                      }
                    }
                  }
                }
              }
            `;

            const variables = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: context.issue.number
            };

            try {
              const result = await github.graphql(query, variables);
              const issueOrPR = result.repository.issueOrPullRequest;
              const projectItems = issueOrPR ? issueOrPR.projectItems.nodes : [];
              
              for (const item of projectItems) {
                for (const fieldValue of item.fieldValues.nodes) {
                  if (fieldValue.field && fieldValue.field.name === 'Status') {
                    const status = fieldValue.name || fieldValue.text;
                    console.log(`Found status: ${status} in project: ${item.project.title}`);
                    
                    if (status && (status.toLowerCase().includes('done') || status.toLowerCase().includes('completed'))) {
                      console.log('Issue is in Done status, checking if it should be closed');
                      
                      // Check if issue is still open
                      const issueData = await github.rest.issues.get({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number
                      });
                      
                      if (issueData.data.state === 'open') {
                        console.log('Closing issue as it is marked as Done');
                        
                        // Close the issue
                        await github.rest.issues.update({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          state: 'closed'
                        });
                        
                        // Add a comment
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          body: '🎉 This issue has been automatically closed because it was marked as "Done" in the project board.'
                        });
                        
                        console.log(`Successfully closed issue #${context.issue.number}`);
                      } else {
                        console.log('Issue is already closed');
                      }
                      
                      break;
                    }
                  }
                }
              }
            } catch (error) {
              console.log('Error checking project status:', error);
              // Don't fail the workflow if project API is not available
            }
