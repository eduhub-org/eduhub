# Optimized parallel frontend checks for faster CI/CD
name: Frontend Quality Checks

on:
  push:
    paths:
      - frontend-nx/**
    branches:
      - "**"
      - "!staging"
      - "!production"
  pull_request:
    paths:
      - frontend-nx/**
    branches:
      - develop
    types: [opened, synchronize, reopened]

# Set minimum required permissions
permissions:
  contents: read

jobs:
  # Shared setup job - builds once, shares with all other jobs
  setup:
    name: "Setup & Build"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    permissions:
      contents: read
    
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Checkout project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Use Node.js 18.x
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 18.x

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 10.15.1

      - name: Generate cache key
        id: cache-key
        shell: bash
        run: |
          set -euo pipefail
          echo "key=node-modules-${{ hashFiles('frontend-nx/pnpm-lock.yaml') }}" >> $GITHUB_OUTPUT

      - name: Cache node modules
        uses: actions/cache@ab5e6d0c87105b4c9c2047343972218f562e4319 # v4.0.1
        with:
          path: frontend-nx/node_modules
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            node-modules-

      - name: Install dependencies
        working-directory: frontend-nx
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Build application
        working-directory: frontend-nx
        shell: bash
        run: |
          set -euo pipefail
          npx nx run edu-hub:build

      - name: Cache build output
        uses: actions/cache@ab5e6d0c87105b4c9c2047343972218f562e4319 # v4.0.1
        with:
          path: |
            frontend-nx/dist
            frontend-nx/.nx/cache
          key: build-${{ github.sha }}

  # Parallel job 1: Linting
  lint:
    name: "Lint Code"
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 5
    
    permissions:
      contents: read
    
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Checkout project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node.js 18.x
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 18.x

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 10.15.1

      - name: Restore node modules
        uses: actions/cache@ab5e6d0c87105b4c9c2047343972218f562e4319 # v4.0.1
        with:
          path: frontend-nx/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Run linting
        working-directory: frontend-nx
        shell: bash
        run: |
          set -euo pipefail
          npx nx run edu-hub:lint

  # Parallel job 2: Critical Component Tests
  critical-tests:
    name: "Critical Component Tests"
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 8
    
    permissions:
      contents: read
    
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Checkout project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node.js 18.x
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 18.x

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 10.15.1

      - name: Restore node modules
        uses: actions/cache@ab5e6d0c87105b4c9c2047343972218f562e4319 # v4.0.1
        with:
          path: frontend-nx/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Run critical component tests
        working-directory: frontend-nx
        shell: bash
        run: |
          set -euo pipefail
          pnpm test -- TimeLocationLanguageInstructors.test.tsx --coverage

  # Parallel job 3: Full Test Suite
  test-suite:
    name: "Full Test Suite"
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 15
    
    permissions:
      contents: read
    
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Checkout project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node.js 18.x
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 18.x

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 10.15.1

      - name: Restore node modules
        uses: actions/cache@ab5e6d0c87105b4c9c2047343972218f562e4319 # v4.0.1
        with:
          path: frontend-nx/node_modules
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Run full test suite
        working-directory: frontend-nx
        shell: bash
        run: |
          set -euo pipefail
          pnpm test:ci

      - name: Upload coverage
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: coverage-report
          path: frontend-nx/coverage
          retention-days: 7

  # Summary job that requires all parallel jobs to pass
  quality-gate:
    name: "Quality Gate"
    runs-on: ubuntu-latest
    needs: [setup, lint, critical-tests, test-suite]
    timeout-minutes: 2
    
    permissions:
      contents: read
    
    if: always()
    
    steps:
      - name: Check all jobs status
        shell: bash
        run: |
          set -euo pipefail
          
          # Check if any required job failed
          if [[ "${{ needs.setup.result }}" != "success" ]]; then
            echo "❌ Setup job failed"
            exit 1
          fi
          
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "❌ Linting failed"
            exit 1
          fi
          
          if [[ "${{ needs.critical-tests.result }}" != "success" ]]; then
            echo "❌ Critical component tests failed"
            exit 1
          fi
          
          if [[ "${{ needs.test-suite.result }}" != "success" ]]; then
            echo "❌ Test suite failed"
            exit 1
          fi
          
          echo "✅ All quality checks passed!"
