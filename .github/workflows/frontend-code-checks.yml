# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Code Checks edu-hub

on:
  push:
    paths:
      - frontend-nx/**
    branches:
      - "**"
      - "!staging"
      - "!production"
  pull_request:
    paths:
      - frontend-nx/**
    branches:
      - develop
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && !contains(github.event.head_commit.message, 'Merge pull request'))
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
          cache-dependency-path: frontend-nx/yarn.lock

      - name: Install yarn dependencies
        working-directory: frontend-nx
        run: yarn install --immutable

      - name: Build edu hub
        working-directory: frontend-nx
        run: yarn build

      - name: Check linting edu hub
        working-directory: frontend-nx
        run: yarn lint
