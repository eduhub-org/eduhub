name: Keycloak Code Checks

on:
  push:
    paths:
      - .github/workflows/keycloak-code-checks.yml
      - docker-compose.yml
      - keycloak/**
      - scripts/rebuild-keycloak-matrix-handle-listener.sh
  pull_request:
    paths:
      - .github/workflows/keycloak-code-checks.yml
      - docker-compose.yml
      - keycloak/**
      - scripts/rebuild-keycloak-matrix-handle-listener.sh
    types: [opened, synchronize, reopened]

jobs:
  keycloak-spi-version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Keycloak SPI version alignment
        run: scripts/rebuild-keycloak-matrix-handle-listener.sh --check
