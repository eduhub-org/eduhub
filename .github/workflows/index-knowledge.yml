name: Index Assistant knowledge

# Rebuilds the Assistant's knowledge index (issue #2195) from the released tag, never develop:
# after every successful production deployment, or by hand for a given tag. The indexer reuses
# embeddings of unchanged passages and switches to the new index in one transaction, so a failed
# run keeps the previous index live.
#
# The production deployment (build-production-infrastructure.yml) calls this workflow as its last
# job, so it runs from the production branch, which the production environment requires. A
# workflow_run trigger can't do that: GitHub runs it from the default branch (develop), and the
# environment rejects it. By hand, start it with `gh workflow run index-knowledge.yml --ref production`.

on:
  workflow_call:
    inputs:
      deployed_sha:
        description: "The commit the calling deployment ran on"
        type: string
        required: true
      tag:
        description: "Release tag to index; empty = the release of deployed_sha"
        type: string
        required: false
        default: ""
      force:
        description: "Replace the index even if the new one is much smaller"
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to index (e.g. v2.20.0); empty = latest release on production"
        required: false
      force:
        description: "Replace the index even if the new one is much smaller"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: index-assistant-knowledge
  cancel-in-progress: false

jobs:
  index:
    name: Build the knowledge index
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout production with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: production
          fetch-depth: 0

      # The indexer itself runs from production (trusted, current); the release it indexes is checked
      # out on its own, so an older tag without the indexer can still be indexed.
      - name: Check out the released tag next to it
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          # The commit the calling deployment ran on (empty for a manual run).
          DEPLOYED_SHA: ${{ inputs.deployed_sha }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ] && [ -n "${DEPLOYED_SHA:-}" ]; then
            # The Release workflow tags its "chore(release)" commit on top of the deployed one, at
            # the same time as the deployment: the release of this deployment is the first tag that
            # contains it, whatever reached production since. Wait for it if it isn't pushed yet.
            for attempt in $(seq 1 20); do
              tag="$(git tag --contains "$DEPLOYED_SHA" --list 'v*' --sort=v:refname | head -n 1)"
              [ -n "$tag" ] && break
              sleep 30
              git fetch --quiet --tags origin
            done
            if [ -z "$tag" ]; then
              # A deployment of only docs/ci/chore commits gets no release: the live release is
              # still the latest one it contains (re-indexing it reuses every embedding).
              tag="$(git tag --merged "$DEPLOYED_SHA" --list 'v*' --sort=-v:refname | head -n 1)"
              echo "::notice::No release tag contains $DEPLOYED_SHA; indexing $tag, the latest release it contains."
            fi
          elif [ -z "$tag" ]; then
            tag="$(git tag --merged HEAD --list 'v*' --sort=-v:refname | head -n 1)"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::No release tag to index (got '$tag')."
            exit 1
          fi
          release_dir="$RUNNER_TEMP/release"
          git worktree add --detach --quiet "$release_dir" "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "dir=$release_dir" >> "$GITHUB_OUTPUT"

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - name: Install the indexer's dependencies
        working-directory: functions/callNodeFunction
        run: npm ci --ignore-scripts

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_EDUHUB_PRODUCTION_KEY }}

      - name: Read the Hasura admin secret and a Vertex AI token
        env:
          PROJECT_ID: ${{ vars.PROJECT_ID }}
        run: |
          set -euo pipefail
          admin_secret="$(gcloud secrets versions access latest --secret=hasura-graphql-admin-key --project="$PROJECT_ID")"
          token="$(gcloud auth print-access-token)"
          echo "::add-mask::$admin_secret"
          echo "::add-mask::$token"
          {
            echo "HASURA_ADMIN_SECRET=$admin_secret"
            echo "EMBEDDING_ACCESS_TOKEN=$token"
          } >> "$GITHUB_ENV"

      - name: Build the index
        working-directory: functions/callNodeFunction
        env:
          HASURA_ENDPOINT: ${{ vars.NEXT_PUBLIC_API_URL }}
          EMBEDDING_PROVIDER: vertex
          EMBEDDING_PROJECT_ID: ${{ vars.PROJECT_ID }}
          # EU processing (ADR 0005): the same region as the expert embeddings.
          EMBEDDING_LOCATION: ${{ vars.EMBEDDING_LOCATION || 'europe-west1' }}
          TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_DIR: ${{ steps.tag.outputs.dir }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: node scripts/index-knowledge.js --repo "$RELEASE_DIR" --release "$TAG" $FORCE
