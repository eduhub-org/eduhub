name: Restore Production Edu Frontend Traffic

run-name: ${{ inputs.execute_restoration && 'RESTORE' || 'INSPECT' }} production Edu traffic${{ inputs.target_revision && format(' to {0}', inputs.target_revision) || '' }}

on:
  workflow_dispatch:
    inputs:
      target_revision:
        description: "Ready edu-* revision; leave empty to list candidates only"
        required: false
        type: string
      execute_restoration:
        description: "Route production traffic; leave disabled for a read-only preview"
        required: true
        default: false
        type: boolean
      confirmation:
        description: "For execution, enter exactly: RESTORE PRODUCTION EDU TRAFFIC"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: restore-production-edu-traffic
  cancel-in-progress: false

jobs:
  restore-edu-traffic:
    name: Validate and restore Edu frontend traffic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      REGION: ${{ secrets.GCP_REGION }}
      EDU_SERVICE: edu
      TARGET_REVISION: ${{ inputs.target_revision }}
      EXECUTE_RESTORATION: ${{ inputs.execute_restoration }}
      CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Authenticate to production Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_EDUHUB_PRODUCTION_KEY }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Validate restoration inputs
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$TARGET_REVISION" ]] && \
            [[ ! "$TARGET_REVISION" =~ ^edu-[a-z0-9-]+$ ]]; then
            echo "target_revision must match edu-[a-z0-9-]+" >&2
            exit 1
          fi

          if [[ "$EXECUTE_RESTORATION" == "true" ]]; then
            if [[ -z "$TARGET_REVISION" ]]; then
              echo "Execution requires a target_revision." >&2
              exit 1
            fi

            if [[ "$CONFIRMATION" != "RESTORE PRODUCTION EDU TRAFFIC" ]]; then
              echo "Execution requires the exact confirmation phrase." >&2
              exit 1
            fi
          fi

      - name: Show current production Edu traffic
        shell: bash
        run: |
          set -euo pipefail

          gcloud run services describe "$EDU_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='yaml(metadata.name,status.url,status.latestCreatedRevisionName,status.latestReadyRevisionName,status.traffic,status.conditions)'

      - name: List recent Edu revision candidates
        shell: bash
        run: |
          set -euo pipefail

          gcloud run revisions list \
            --service "$EDU_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --limit 20 \
            --sort-by='~metadata.creationTimestamp' \
            --format='table(metadata.name,metadata.creationTimestamp,status.conditions[0].status,status.conditions[0].reason,spec.containers[0].image)'

      - name: Validate target revision is ready
        if: ${{ inputs.target_revision != '' }}
        shell: bash
        run: |
          set -euo pipefail

          revision_file="$RUNNER_TEMP/target-revision.json"
          gcloud run revisions describe "$TARGET_REVISION" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format=json > "$revision_file"

          target_service=$(jq -r \
            '.metadata.labels["serving.knative.dev/service"] // empty' \
            "$revision_file")
          ready_status=$(jq -r \
            '[.status.conditions[]? | select(.type == "Ready")][0].status // empty' \
            "$revision_file")
          target_image=$(jq -r '.spec.containers[0].image // empty' \
            "$revision_file")

          if [[ "$target_service" != "$EDU_SERVICE" ]]; then
            echo "Revision belongs to '$target_service', not '$EDU_SERVICE'." >&2
            exit 1
          fi

          if [[ "$ready_status" != "True" ]]; then
            echo "Revision '$TARGET_REVISION' is not Ready." >&2
            exit 1
          fi

          echo "Validated ready revision: $TARGET_REVISION"
          echo "Container image: $target_image"

      - name: Preview production traffic restoration
        if: ${{ !inputs.execute_restoration && inputs.target_revision != '' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Preview only: no production state was changed."
          echo "An execution would route 100% of '$EDU_SERVICE' traffic"
          echo "to ready revision '$TARGET_REVISION'."

      - name: Explain candidate-list-only run
        if: ${{ !inputs.execute_restoration && inputs.target_revision == '' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Candidate list only: no production state was changed."
          echo "Run this workflow again with a ready edu-* target revision."
          echo "Keep execute_restoration disabled to preview it first."

      - name: Route production Edu traffic to target revision
        if: ${{ inputs.execute_restoration }}
        shell: bash
        run: |
          set -euo pipefail

          gcloud run services update-traffic "$EDU_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --to-revisions "${TARGET_REVISION}=100" \
            --quiet

      - name: Verify restored production traffic
        if: ${{ inputs.execute_restoration }}
        shell: bash
        run: |
          set -euo pipefail

          routed_percent=$(gcloud run services describe "$EDU_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format=json | jq -r \
              --arg revision "$TARGET_REVISION" \
              '[.status.traffic[] | select(.revisionName == $revision) | .percent][0] // 0')

          if [[ "$routed_percent" != "100" ]]; then
            echo "Expected 100% traffic on '$TARGET_REVISION'; got ${routed_percent}%." >&2
            exit 1
          fi

          echo "Production Edu traffic restored to $TARGET_REVISION."
          curl --fail --silent --show-error --location --max-time 30 \
            https://edu.opencampus.sh/version.json
          echo
