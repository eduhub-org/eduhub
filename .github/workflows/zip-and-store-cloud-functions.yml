name: Build and Store a Docker Image in the Artifact Registry

on:
  workflow_call:
    inputs:
      # ID of the project in Google in which the image will be stored and deployed
      PROJECT_ID:
        required: true
        type: string
      # Name of the cloud function (and of the folder in which it is defined)
      CLOUD_FUNCTION_FOLDER:
        required: true
        type: string
      # Name of the Google storage bucket in which the archive will be stored
      BUCKET_NAME:
        required: true
        type: string

    secrets:
      GCP_SERVICE_ACCOUNT_KEY:
        required: true
      GCP_REGION:
        required: true

jobs:
  zip-and-store:
    name: Zip and Store Cloud Function in Google Storage Bucket
    runs-on: ubuntu-latest

    steps:
      - name: Check Out the Repository Branch
        uses: actions/checkout@v5

      - name: Replace symlinks with actual files
        env:
          CF_FOLDER: ${{ inputs.CLOUD_FUNCTION_FOLDER }}
        run: |
          set -euo pipefail
          if [[ -z "${CF_FOLDER}" ]]; then echo "CLOUD_FUNCTION_FOLDER is empty"; exit 1; fi
          if [[ "${CF_FOLDER}" == /* ]]; then echo "CLOUD_FUNCTION_FOLDER must be relative"; exit 1; fi
          if [[ "${CF_FOLDER}" == *..* ]]; then echo "CLOUD_FUNCTION_FOLDER must not contain '..'"; exit 1; fi
          resolved=$(cd "${GITHUB_WORKSPACE}/${CF_FOLDER}" 2>/dev/null && pwd)
          if [[ -z "${resolved}" || "${resolved}" != "${GITHUB_WORKSPACE}"/* ]]; then echo "CLOUD_FUNCTION_FOLDER resolves outside workspace"; exit 1; fi

          # Remove symlinks and copy actual files for apiProxy
          rm -f ./${CF_FOLDER}/apiProxy/api_clients
          cp -r ./${CF_FOLDER}/shared_libs/api_clients ./${CF_FOLDER}/apiProxy/

          # Remove symlinks and copy actual files for callPythonFunction
          rm -f ./${CF_FOLDER}/callPythonFunction/api_clients
          cp -r ./${CF_FOLDER}/shared_libs/api_clients ./${CF_FOLDER}/callPythonFunction/

          # Copy shared Node security helpers into each Node function package
          for fn in callNodeFunction sendMail sendQuestionaires nodePayments keycloakAdmin; do
            rm -rf ./${CF_FOLDER}/$fn/shared_libs
            mkdir -p ./${CF_FOLDER}/$fn/shared_libs
            cp -r ./${CF_FOLDER}/shared_libs/node ./${CF_FOLDER}/$fn/shared_libs/
          done

      - name: Zip Archive for callPythonFunction
        uses: thedoctor0/zip-release@main
        with:
          type: "zip"
          directory: "./${{ inputs.CLOUD_FUNCTION_FOLDER }}/callPythonFunction"
          filename: "../callPythonFunction.zip"

      - name: Zip Archive for sendMail
        uses: thedoctor0/zip-release@main
        with:
          type: "zip"
          directory: "./${{ inputs.CLOUD_FUNCTION_FOLDER }}/sendMail"
          filename: "../sendMail.zip"

      - name: Zip Archive for keycloakAdmin
        uses: thedoctor0/zip-release@main
        with:
          type: "zip"
          directory: "./${{ inputs.CLOUD_FUNCTION_FOLDER }}/keycloakAdmin"
          filename: "../keycloakAdmin.zip"

      - name: Zip Archive for callNodeFunction
        uses: thedoctor0/zip-release@main
        with:
          type: "zip"
          directory: "./${{ inputs.CLOUD_FUNCTION_FOLDER }}/callNodeFunction"
          filename: "../callNodeFunction.zip"

      - name: Zip Archive for nodePayments
        uses: thedoctor0/zip-release@main
        with:
          type: "zip"
          directory: "./${{ inputs.CLOUD_FUNCTION_FOLDER }}/nodePayments"
          filename: "../nodePayments.zip"

      - name: Zip Archive for sendQuestionaires
        uses: thedoctor0/zip-release@main
        with:
          type: "zip"
          directory: "./${{ inputs.CLOUD_FUNCTION_FOLDER }}/sendQuestionaires"
          filename: "../sendQuestionaires.zip"

      - name: Zip Archive for apiProxy
        uses: thedoctor0/zip-release@main
        with:
          type: "zip"
          directory: "./${{ inputs.CLOUD_FUNCTION_FOLDER }}/apiProxy"
          filename: "../apiProxy.zip"

      - name: Authenticate to Google Cloud
        id: "auth"
        uses: "google-github-actions/auth@v3"
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          project_id: ${{ inputs.PROJECT_ID }}

      - name: Upload Archives to Google Cloud
        id: "upload-archives"
        uses: "google-github-actions/upload-cloud-storage@v3"
        with:
          path: "./${{ inputs.CLOUD_FUNCTION_FOLDER }}"
          destination: "${{ inputs.BUCKET_NAME }}/cloud-functions"
          glob: "*.zip"
          parent: false
          process_gcloudignore: false

      - name: Show Output
        run: echo ${{ steps.deploy.outputs.url }}
