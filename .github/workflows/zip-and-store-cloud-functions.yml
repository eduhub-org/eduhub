name: Zip and Store Cloud Functions

on:
  workflow_call:
    inputs:
      # ID of the project in Google in which the image will be stored and deployed
      PROJECT_ID:
        required: true
        type: string
      # Folder that holds the cloud functions (one sub-folder per unit)
      CLOUD_FUNCTION_FOLDER:
        required: true
        type: string
      # Name of the Google storage bucket in which the archive will be stored
      BUCKET_NAME:
        required: true
        type: string

    secrets:
      GCP_SERVICE_ACCOUNT_KEY:
        required: true
      GCP_REGION:
        required: true

permissions:
  contents: read

jobs:
  zip-and-store:
    name: Zip and Store Cloud Function in Google Storage Bucket
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check Out the Repository Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # One archive per unit in <CLOUD_FUNCTION_FOLDER>/units.json, which
      # functions/dev.js reads too. A unit with a `source` (identity, media)
      # gets no archive: Terraform deploys its source unit's zip with the
      # unit's own entry point. Shared code reaches a unit through a
      # committed symlink (Node: ./shared -> ../shared, Python: ./api_clients
      # -> ../shared_py/api_clients). zip stores the files a symlink points
      # to unless given -y/--symlinks, so each archive holds real copies.
      - name: Zip one archive per cloud function
        env:
          CF_FOLDER: ${{ inputs.CLOUD_FUNCTION_FOLDER }}
        run: |
          set -euo pipefail
          if [[ -z "${CF_FOLDER}" ]]; then echo "CLOUD_FUNCTION_FOLDER is empty"; exit 1; fi
          if [[ "${CF_FOLDER}" == /* ]]; then echo "CLOUD_FUNCTION_FOLDER must be relative"; exit 1; fi
          if [[ "${CF_FOLDER}" == *..* ]]; then echo "CLOUD_FUNCTION_FOLDER must not contain '..'"; exit 1; fi
          resolved=$(cd "${GITHUB_WORKSPACE}/${CF_FOLDER}" 2>/dev/null && pwd)
          if [[ -z "${resolved}" || "${resolved}" != "${GITHUB_WORKSPACE}"/* ]]; then echo "CLOUD_FUNCTION_FOLDER resolves outside workspace"; exit 1; fi

          out="${GITHUB_WORKSPACE}/cloud-function-zips"
          mkdir -p "${out}"
          mapfile -t units < <(jq -r '.[] | select(.source == null) | .name' "${resolved}/units.json")
          if [[ ${#units[@]} -eq 0 ]]; then echo "units.json lists no units"; exit 1; fi
          # Every `source` must be a unit that gets its own archive.
          missing=$(jq -r '[.[] | select(.source == null) | .name] as $own
            | .[] | select(.source != null and (.source as $s | $own | index($s) | not))
            | "\(.name) -> \(.source)"' "${resolved}/units.json")
          if [[ -n "${missing}" ]]; then echo "unknown source unit: ${missing}"; exit 1; fi
          # Node units ship without tests, Jest config, the type-check config
          # and the one-off CLIs in scripts/ (zip's * also matches '/').
          node_excludes=('__tests__/*' '*/__tests__/*' '*.test.js' 'coverage/*' \
            'jest/*' 'jest.config.js' 'jest.setup.js' 'scripts/*' 'tsconfig.json')
          for unit in "${units[@]}"; do
            if [[ ! "${unit}" =~ ^[A-Za-z0-9_-]+$ ]]; then echo "bad unit name: ${unit}"; exit 1; fi
            runtime=$(jq -r --arg u "${unit}" '.[] | select(.name == $u) | .runtime' "${resolved}/units.json")
            excludes=()
            if [[ "${runtime}" == "node" ]]; then excludes=("${node_excludes[@]}"); fi
            (
              cd "${resolved}/${unit}"
              zip -q -r "${out}/${unit}.zip" . \
                -x 'node_modules/*' '*/node_modules/*' \
                '__pycache__/*' '*/__pycache__/*' '.venv/*' "${excludes[@]}"
            )
            # A symlink left in an archive would deploy as a dangling link.
            links=$(zipinfo "${out}/${unit}.zip" | grep -c '^l' || true)
            if [[ "${links}" != 0 ]]; then
              echo "${unit}.zip contains ${links} symlink(s)"; exit 1
            fi
          done
          ls -l "${out}"

      - name: Authenticate to Google Cloud
        id: "auth"
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          project_id: ${{ inputs.PROJECT_ID }}

      # Terraform reads the fixed names cloud-functions/<Unit>.zip.
      - name: Upload Archives to Google Cloud
        id: "upload-archives"
        uses: google-github-actions/upload-cloud-storage@6397bd7208e18d13ba2619ee21b9873edc94427a # v3.0.0
        with:
          path: "./cloud-function-zips"
          destination: "${{ inputs.BUCKET_NAME }}/cloud-functions"
          glob: "*.zip"
          parent: false
          process_gcloudignore: false

      # Rollback copies, one folder per commit. Bucket object versioning stays
      # off on purpose: the bucket also holds user files, and versioning would
      # keep files that users deleted.
      - name: Upload Rollback Copies to Google Cloud
        id: "upload-archive-copies"
        uses: google-github-actions/upload-cloud-storage@6397bd7208e18d13ba2619ee21b9873edc94427a # v3.0.0
        with:
          path: "./cloud-function-zips"
          destination: "${{ inputs.BUCKET_NAME }}/cloud-functions/archive/${{ github.sha }}"
          glob: "*.zip"
          parent: false
          process_gcloudignore: false
