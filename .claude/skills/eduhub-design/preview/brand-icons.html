<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0}
  body{font-family:'Space Grotesk',sans-serif;background:#222222;color:#F2F2F2;padding:24px}
  .row{display:flex;gap:30px;align-items:flex-start;flex-wrap:wrap}
  .ic{text-align:center;width:84px}
  .ic .frame{width:84px;height:64px;background:#2a2a2a;border:1px solid #444;border-radius:12px;display:flex;align-items:center;justify-content:center}
  .ic img{width:26px;height:26px;filter:brightness(0) invert(1)}
  .ic .l{font-size:11px;opacity:.6;margin-top:7px}
</style>
</head>
<body>
  <div class="row">
    <div class="ic"><div class="frame"><img src="../assets/icon-pin.svg" alt=""></div><div class="l">pin</div></div>
    <div class="ic"><div class="frame"><img src="../assets/icon-language.svg" alt=""></div><div class="l">language</div></div>
    <div class="ic"><div class="frame"><img src="../assets/icon-online.svg" alt=""></div><div class="l">online</div></div>
    <div class="ic"><div class="frame"><img src="../assets/icon-checkmark.svg" alt=""></div><div class="l">checkmark</div></div>
    <div class="ic"><div class="frame"><img src="../assets/x-calibur-white.svg" alt=""></div><div class="l">arrow</div></div>
  </div>
</body>
</html>
