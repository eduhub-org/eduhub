<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-body);background:#222222;color:#F2F2F2;padding:24px}
  .row{display:flex;gap:20px;align-items:flex-end}
  .item{text-align:center}
  .box{background:#2a2a2a;border:1px solid #444;width:96px;height:80px}
  .lab{font-size:12px;margin-top:8px;opacity:.65}
  .v{font-size:11px;opacity:.45}
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:8px"></div><div class="lab">menu / modal</div><div class="v">8px</div></div>
    <div class="item"><div class="box" style="border-radius:16px"></div><div class="lab">card · rounded-2xl</div><div class="v">16px</div></div>
    <div class="item"><div class="box" style="border-radius:9999px;width:140px"></div><div class="lab">button / badge</div><div class="v">9999px (pill)</div></div>
  </div>
</body>
</html>
