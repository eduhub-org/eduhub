<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-body);background:#222222;padding:22px}
  .row{display:flex;gap:14px}
  .sw{flex:1;border-radius:14px;height:108px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;box-sizing:border-box}
  .name{font-weight:600;font-size:13px}
  .hex{font-size:12px;opacity:.9;font-weight:400}
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:#A2EBA0;color:#143a13"><div class="name">success</div><div class="hex">#A2EBA0</div></div>
    <div class="sw" style="background:#FFA665;color:#4a2400"><div class="name">warning</div><div class="hex">#FFA665</div></div>
    <div class="sw" style="background:#D45A5A;color:#fff"><div class="name">error</div><div class="hex">#D45A5A</div></div>
    <div class="sw" style="background:#1982fc;color:#fff"><div class="name">info</div><div class="hex">#1982fc</div></div>
  </div>
</body>
</html>
