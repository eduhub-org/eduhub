<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0}
  body{font-family:'Space Grotesk',sans-serif;background:#222222;padding:28px;display:flex;align-items:center;gap:40px}
  .lockup{display:flex;align-items:center;gap:12px}
  .lockup img.ring{width:54px;height:54px}
  .lockup img.word{height:40px;filter:brightness(0) invert(1)}
  .stack{color:#fff}
  .stack .a{font-size:26px;font-weight:500;letter-spacing:.02em}
  .stack .b{font-size:18px;font-weight:300}
  .sep{width:1px;height:64px;background:#444}
</style>
</head>
<body>
  <div class="lockup">
    <img class="ring" src="../assets/oc-logo.svg" alt="opencampus ring mark">
    <img class="word" src="../assets/eduhub-logo.svg" alt="EduHub wordmark">
  </div>
  <div class="sep"></div>
  <div class="stack">
    <div class="a">EDU HUB</div>
    <div class="b">by opencampus.sh</div>
  </div>
</body>
</html>
