<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-body);background:#222222;color:#F2F2F2;padding:22px}
  .row{display:flex;gap:14px}
  .sw{flex:1;border-radius:14px;height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;box-sizing:border-box}
  .name{font-weight:600;font-size:14px}
  .hex{font-size:12px;opacity:.85;font-weight:400;letter-spacing:.02em}
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:#00A398;color:#fff"><div class="name">brand</div><div class="hex">#00A398</div></div>
    <div class="sw" style="background:#00C4B8;color:#06302d"><div class="name">brand-light</div><div class="hex">#00C4B8</div></div>
    <div class="sw" style="background:#008078;color:#fff"><div class="name">brand-dark</div><div class="hex">#008078</div></div>
  </div>
</body>
</html>
