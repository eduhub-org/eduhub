<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-body);background:#222222;color:#F2F2F2;padding:24px}
  .r{display:flex;align-items:baseline;gap:16px;padding:7px 0;border-bottom:1px solid #333}
  .r:last-child{border:0}
  .tag{width:140px;flex:none;font-size:12px;opacity:.55;font-weight:400}
  .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
  <div class="r"><span class="tag">display · 8rem/500</span><span class="s" style="font-size:52px;line-height:1;font-weight:500">Start Hacking</span></div>
  <div class="r"><span class="tag">h2 · 1.5rem/600</span><span class="s" style="font-size:24px;font-weight:600">Find your courses</span></div>
  <div class="r"><span class="tag">tile · 1.875rem/400</span><span class="s" style="font-size:30px">Intro to Machine Learning</span></div>
  <div class="r"><span class="tag">body-lg · 1.125rem</span><span class="s" style="font-size:18px">A vibrant community of learning.</span></div>
  <div class="r"><span class="tag">caption · .75rem ↑</span><span class="s" style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85">Kiel + Online</span></div>
</body>
</html>
