<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-body);background:#222222;color:#F2F2F2;padding:22px}
  .row{display:flex;gap:14px}
  .sw{flex:1;border-radius:14px;height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;box-sizing:border-box;border:1px solid rgba(255,255,255,.12)}
  .name{font-weight:600;font-size:13px}
  .hex{font-size:12px;opacity:.85;font-weight:400}
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:#ffffff;color:#222"><div class="name">light bg / fill</div><div class="hex">#FFFFFF</div></div>
    <div class="sw" style="background:#F2F2F2;color:#222"><div class="name">bg-secondary</div><div class="hex">#F2F2F2</div></div>
    <div class="sw" style="background:#E5E5E5;color:#222"><div class="name">disabled / hover</div><div class="hex">#E5E5E5</div></div>
    <div class="sw" style="background:#D8D8D8;color:#222"><div class="name">border</div><div class="hex">#D8D8D8</div></div>
  </div>
</body>
</html>
