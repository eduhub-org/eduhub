<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-body);background:#222222;color:#F2F2F2;padding:22px}
  .row{display:flex;gap:14px}
  .sw{flex:1;border-radius:14px;height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;box-sizing:border-box;border:1px solid #444}
  .name{font-weight:600;font-size:13px}
  .hex{font-size:12px;opacity:.85;font-weight:400}
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:#0F0F0F"><div class="name">bg-deep</div><div class="hex">#0F0F0F</div></div>
    <div class="sw" style="background:#222222"><div class="name">bg-primary</div><div class="hex">#222222</div></div>
    <div class="sw" style="background:#2a2a2a"><div class="name">bg-card</div><div class="hex">#2a2a2a</div></div>
    <div class="sw" style="background:#333333"><div class="name">bg-secondary</div><div class="hex">#333333</div></div>
    <div class="sw" style="background:#444444"><div class="name">fill-disabled</div><div class="hex">#444444</div></div>
  </div>
</body>
</html>
