# Instructors must not inherit user_access: Hasura cannot merge inherited permissions when
# ProjectAuthor insert presets conflict (student join-request vs instructor add-author).
# Instructors acting as course participants should use JWT role `user` (then user_access applies).
- role_name: instructor
  role_set:
    - instructor_access
    - anonymous
- role_name: user
  role_set:
    - user_access
    - user_access_others
    - anonymous
# Organization admins manage their organization's settings/programs/courses through the
# org_admin_access role. They browse the platform normally under the `user` role, so org_admin
# deliberately does NOT inherit user_access (the frontend pins the role per request).
- role_name: org_admin
  role_set:
    - org_admin_access
    - anonymous
