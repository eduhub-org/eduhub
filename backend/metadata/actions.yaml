actions:
  - name: anonymizeUser
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: bucket
          value_from_env: HASURA_BUCKET
        - name: name
          value: anonymizeUser
    comment: Anonymizes a user's data in Hasura and Googl Cloud bucket and deletes it in Keycloak
  - name: createCertificate
    definition:
      kind: synchronous
      # Default Hasura action timeout (60s) causes 504 while many PDFs are generated in parallel.
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      timeout: 180
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: bucket
          value_from_env: HASURA_BUCKET
        - name: name
          value: createCertificate
    comment: Generates a certificate of a given type for a given course and user id
  - name: createCertificates
    definition:
      kind: synchronous
      # Python handler generates certificates sequentially per enrollment; large batches need >60s.
      handler: '{{CLOUD_FUNCTION_LINK_CALL_PYTHON_FUNCTION}}'
      timeout: 300
      headers:
        - name: Hasura-Secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: Bucket
          value_from_env: HASURA_BUCKET
        - name: Function-Name
          value: create_certificates
    comment: createCertificates
  - name: createStripeBasePrice
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: name
          value: createStripeBasePrice
    permissions:
      - role: instructor_access
    comment: Creates or updates Stripe Product and Price for a course's base price
  - name: createMatrixRoom
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: name
          value: createMatrixRoom
    permissions:
      - role: instructor_access
    comment: Creates Matrix program space and course room, then stores matrix ids in Hasura
  - name: copyProjectFromTemplate
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: name
          value: copyProjectFromTemplate
    permissions:
      - role: user_access
    comment: Claims an open Project template by copying it for the current user. Inserts ProjectAuthor (ACCEPTED), copies ProjectMentor rows from the parent, and links the new project to the requested course.
  - name: syncProgramInstructorMatrixRoom
    definition:
      kind: synchronous
      # Must exceed call-node-function Matrix phase (120s) + 429 backoff; default Hasura timeout is 60s → 504.
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      timeout: 180
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: name
          value: syncProgramInstructorMatrixRoom
    comment: Invites all program course instructors to the configured Matrix instructor room
  - name: createEnrollmentWithAddons
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: name
          value: createEnrollmentWithAddons
    permissions:
      - role: user_access
    comment: Creates a course enrollment and saves selected addons from Formbricks survey to the database
  - name: createStripeCheckout
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: name
          value: createStripeCheckout
    permissions:
      - role: user_access
    comment: Creates a Stripe Checkout Session for course enrollment with add-ons
  - name: createStripeJobPostingPrices
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: name
          value: createStripeJobPostingPrices
    comment: Bootstraps Stripe products/prices and the 19% tax rate for StuJo job postings (admin only)
  - name: publishJobPosting
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: name
          value: publishJobPosting
    permissions:
      - role: user_access
    comment: Publishes a StuJo job posting (free/credit) or creates the Stripe checkout session for it
  - name: createUser
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: name
          value: createUser
    permissions:
      - role: instructor_access
    comment: Creates a new user in Keycloak and Hasura, schedules welcome email
  - name: getAdminUsers
    definition:
      kind: ""
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: bucket
          value_from_env: HASURA_BUCKET
        - name: name
          value: getAdminUsers
  - name: getFormbricksResponses
    definition:
      kind: ""
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: name
          value: getFormbricksResponses
    permissions:
      - role: instructor_access
    comment: Fetches Formbricks survey responses for a course enrollment
  - name: getFormbricksAddonSelections
    definition:
      kind: ""
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: name
          value: getFormbricksAddonSelections
    permissions:
      - role: user_access
    comment: Fetches selected addons from Formbricks survey responses for course registration
  - name: getSignedUrl
    definition:
      kind: ""
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: bucket
          value_from_env: HASURA_BUCKET
        - name: name
          value: getSignedUrl
    permissions:
      - role: user_access
    comment: Gets a signed url for a file in the Google Storage Bucket
  - name: loadParticipationData
    definition:
      kind: ""
      handler: '{{CLOUD_FUNCTION_LINK_CALL_PYTHON_FUNCTION}}'
      headers:
        - name: Function-Name
          value: load_participation_data
        - name: Hasura-Secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
    comment: loadParticipationData
  - name: makeCertificatePublic
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: bucket
          value_from_env: HASURA_BUCKET
        - name: name
          value: makeCertificatePublic
    permissions:
      - role: user_access
    comment: Makes a certificate file public in storage bucket for LinkedIn sharing
  - name: saveAchievementCertificateTemplate
    definition:
