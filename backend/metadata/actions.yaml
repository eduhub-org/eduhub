actions:
  - name: anonymizeUser
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: bucket
          value_from_env: HASURA_BUCKET
        - name: name
          value: anonymizeUser
    comment: Anonymizes a user's data in Hasura and Googl Cloud bucket and deletes it in Keycloak
  - name: createCertificate
    definition:
      kind: synchronous
      # Default Hasura action timeout (60s) causes 504 while many PDFs are generated in parallel.
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      timeout: 180
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: bucket
          value_from_env: HASURA_BUCKET
        - name: name
          value: createCertificate
    comment: Generates a certificate of a given type for a given course and user id
  - name: createCertificates
    definition:
      kind: synchronous
      # Python handler generates certificates sequentially per enrollment; large batches need >60s.
      handler: '{{CLOUD_FUNCTION_LINK_CALL_PYTHON_FUNCTION}}'
      timeout: 300
      headers:
        - name: Hasura-Secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: Bucket
          value_from_env: HASURA_BUCKET
        - name: Function-Name
          value: create_certificates
    comment: createCertificates
  - name: createStripeBasePrice
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: name
          value: createStripeBasePrice
    permissions:
      - role: instructor_access
    comment: Creates or updates Stripe Product and Price for a course's base price
  - name: createMatrixRoom
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: name
          value: createMatrixRoom
    permissions:
      - role: instructor_access
    comment: Creates Matrix program space and course room, then stores matrix ids in Hasura
  - name: copyProjectFromTemplate
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: name
          value: copyProjectFromTemplate
    permissions:
      - role: user_access
    comment: Claims an open Project template by copying it for the current user. Inserts ProjectAuthor (ACCEPTED), copies ProjectMentor rows from the parent, and links the new project to the requested course.
  - name: syncProgramInstructorMatrixRoom
    definition:
      kind: synchronous
      # Must exceed call-node-function Matrix phase (120s) + 429 backoff; default Hasura timeout is 60s → 504.
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      timeout: 180
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: name
          value: syncProgramInstructorMatrixRoom
    comment: Invites all program course instructors to the configured Matrix instructor room
  - name: createEnrollmentWithAddons
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: name
          value: createEnrollmentWithAddons
    permissions:
      - role: user_access
    comment: Creates a course enrollment and saves selected addons from Formbricks survey to the database
  - name: createStripeCheckout
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: name
          value: createStripeCheckout
    permissions:
      - role: user_access
    comment: Creates a Stripe Checkout Session for course enrollment with add-ons
  - name: archiveJobPosting
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: name
          value: archiveJobPosting
    permissions:
      - role: user_access
    comment: Archives a published/expired StuJo job posting (employer action; status is server-controlled)
  # Self-service organization onboarding. Both are permitted for user_access and re-check
  # authorization in the handler: OrganizationAdmin insert requires canManageSettings on the same
  # organization, so an organization's FIRST grant cannot be created through Hasura at all.
  - name: claimJobOrganization
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: name
          value: claimJobOrganization
    permissions:
      - role: user_access
    comment: Grants canManageJobs for an organization that has no job admin yet, creating the organization if needed (StuJo self-service onboarding)
  - name: requestJobOrganizationAccess
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: name
          value: requestJobOrganizationAccess
    permissions:
      - role: user_access
    comment: Mails an organization's existing job admins that someone is asking for access to its job offers (grants nothing)
  - name: createStripeJobPostingPrices
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: name
          value: createStripeJobPostingPrices
    comment: Bootstraps Stripe products/prices and the 19% tax rate for StuJo job postings (admin only)
  - name: publishJobPosting
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: name
          value: publishJobPosting
    permissions:
      - role: user_access
    comment: Publishes a StuJo job posting (free/credit) or creates the Stripe checkout session for it
  - name: saveJobPostingPdf
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: bucket
          value_from_env: HASURA_BUCKET
        - name: name
          value: saveFile
        - name: file-path
          value: jobpostings/jobposting-${jobpostingid}/public/${filename}
        - name: is-public
          value: "true"
        - name: max-file-size-mb
          value: "15"
    permissions:
      - role: user_access
    comment: Uploads the job posting PDF (StuJo offer document, embedded on the detail page)
  - name: createUser
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: name
          value: createUser
    permissions:
      - role: instructor_access
    comment: Creates a new user in Keycloak and Hasura, schedules welcome email
  - name: getAdminUsers
    definition:
      kind: ""
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: bucket
          value_from_env: HASURA_BUCKET
        - name: name
          value: getAdminUsers
  - name: getFormbricksResponses
    definition:
      kind: ""
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: name
          value: getFormbricksResponses
    permissions:
      - role: instructor_access
    comment: Fetches Formbricks survey responses for a course enrollment
  - name: getFormbricksAddonSelections
    definition:
      kind: ""
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: name
          value: getFormbricksAddonSelections
    permissions:
      - role: user_access
    comment: Fetches selected addons from Formbricks survey responses for course registration
  - name: getSignedUrl
    definition:
      kind: ""
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: bucket
          value_from_env: HASURA_BUCKET
        - name: name
          value: getSignedUrl
    permissions:
      - role: user_access
    comment: Gets a signed url for a file in the Google Storage Bucket
  - name: loadParticipationData
    definition:
      kind: ""
      handler: '{{CLOUD_FUNCTION_LINK_CALL_PYTHON_FUNCTION}}'
      headers:
        - name: Function-Name
          value: load_participation_data
        - name: Hasura-Secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
    comment: loadParticipationData
  - name: makeCertificatePublic
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: bucket
          value_from_env: HASURA_BUCKET
        - name: name
          value: makeCertificatePublic
    permissions:
      - role: user_access
    comment: Makes a certificate file public in storage bucket for LinkedIn sharing
  - name: saveAchievementCertificateTemplate
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: bucket
          value_from_env: HASURA_BUCKET
        - name: name
          value: saveFile
        - name: file-path
          value: programs/program-${programid}/private/achievement-certificate-template/${filename}
  - name: saveAchievementDocumentationTemplate
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: bucket
          value_from_env: HASURA_BUCKET
        - name: name
          value: saveFile
        - name: file-path
          value: achievement-docs-templates/public/template-${achievementDocumentationTemplateId}/${filename}
        - name: is-public
          value: "true"
  - name: saveAchievementRecordCoverImage
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: bucket
          value_from_env: HASURA_BUCKET
        - name: name
          value: saveImage
        - name: file-path
          value: achievement-records/record-${achievementRecordId}/public/cover-image/${filename}
        - name: is-public
          value: "true"
    permissions:
      - role: user_access
  - name: saveAchievementRecordDocumentation
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: bucket
          value_from_env: HASURA_BUCKET
        - name: name
          value: saveFile
        - name: file-path
          value: achievement-records/record-${achievementRecordId}/private/documentation/${filename}
    permissions:
      - role: user_access
  - name: saveAddonMappings
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: name
          value: createStripeAddonPrices
    permissions:
      - role: instructor_access
    comment: Saves validated add-on mappings and creates Stripe Products/Prices
  - name: saveAttendanceCertificateTemplate
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: bucket
          value_from_env: HASURA_BUCKET
        - name: name
          value: saveFile
        - name: file-path
          value: programs/program-${programid}/private/attendance-certificate-template/${filename}
  - name: saveCourseImage
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: bucket
          value_from_env: HASURA_BUCKET
        - name: name
          value: saveImage
        - name: file-path
          value: courses/course-${courseid}/public/cover-image/${filename}
        - name: is-public
          value: "true"
        - name: sizes
          value: '[460, 640, 768, 1024, 1280, 1536]'
    permissions:
      - role: instructor_access
  - name: saveProjectDocumentationInstruction
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: bucket
          value_from_env: HASURA_BUCKET
        # Dedicated handler instead of the generic saveFile: the target object path
        # is derived from projectDocumentationInstructionId, so a caller who is not
        # the owner could otherwise overwrite another instruction's PDF.
        - name: name
          value: saveProjectDocumentationInstruction
        - name: file-path
          value: project-docs-instructions/public/instruction-${projectDocumentationInstructionId}/${filename}
        - name: is-public
          value: "true"
        # Was previously implicit (saveFile's 20 MB default); pinned so widening the
        # caller set does not depend on a handler default.
        - name: max-file-size-bytes
          value: "20971520"
        # Enables validateFileUpload -> isPdf (%PDF- magic bytes + trailing %%EOF) in
        # saveFile/fileValidation.js. Without this header saveFile skips validation
        # entirely, so a renamed non-PDF would reach storage.
        - name: allowed-file-extensions
          value: .pdf
    permissions:
      - role: instructor_access
    comment: Stores an instruction PDF. The handler verifies that a non-admin caller owns the target non-default instruction before delegating to saveFile.
  - name: setProjectDocumentationInstructionDefault
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: name
          value: setProjectDocumentationInstructionDefault
    comment: Atomically promotes one ProjectDocumentationInstruction to the default for its projectTypeValue, demoting whichever row was previously default for the same type.
  - name: deleteProjectDocumentationInstruction
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: name
          value: deleteProjectDocumentationInstruction
    permissions:
      - role: admin
      - role: instructor_access
    comment: Reassigns projects using the instruction to the type default, then deletes the non-default instruction. Instructors may only delete instructions they created (verified in the handler).
  - name: saveProjectImage
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: bucket
          value_from_env: HASURA_BUCKET
        - name: name
          value: saveImage
        - name: file-path
          value: projects/project-${projectid}/public/cover-image/${filename}
        - name: is-public
          value: "true"
        - name: sizes
          value: '[460, 640, 768, 1024, 1280, 1536]'
    permissions:
      - role: instructor_access
      - role: user_access
  - name: saveProjectDocumentation
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: bucket
          value_from_env: HASURA_BUCKET
        - name: name
          value: saveFile
        - name: file-path
          value: projects/project-${projectid}/public/documentation/${filename}
        - name: is-public
          value: "true"
        - name: max-file-size-bytes
          value: "23000000"
        - name: allowed-file-extensions
          value: .pdf,.doc,.docx,.odt,.zip
    permissions:
      - role: instructor_access
      - role: user_access
  - name: saveProjectPresentation
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: bucket
          value_from_env: HASURA_BUCKET
        - name: name
          value: saveFile
        - name: file-path
          value: projects/project-${projectid}/public/presentation/${filename}
        - name: is-public
          value: "true"
        - name: max-file-size-bytes
          value: "23000000"
        - name: allowed-file-extensions
          value: .pdf,.ppt,.pptx,.odp
    permissions:
      - role: instructor_access
      - role: user_access
  - name: saveOrganizationLogo
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: bucket
          value_from_env: HASURA_BUCKET
        - name: name
          value: saveOrganizationLogo
        - name: file-path
          value: organizations/org-${organizationid}/public/logo/${filename}
        - name: is-public
          value: "true"
        - name: sizes
          value: '[64, 128, 256, 512]'
    # Dedicated handler rather than the generic saveImage: the logo is an
    # Organization column that requires canManageSettings to change, and only a
    # handler can check that for the *target* organization. It then delegates to
    # saveImage, so the storage layout above still applies.
    #
    # user_access is permitted because action permissions do not resolve
    # inherited roles: an org admin's requests carry x-hasura-role `user`
    # (useCurrentRole deliberately never returns org_admin), the same reason
    # publishJobPosting and archiveJobPosting are permitted for it.
    permissions:
      - role: instructor_access
      - role: user_access
    comment: Uploads an organization's logo; the handler requires canManageSettings for that organization
  - name: saveUserProfileImage
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: bucket
          value_from_env: HASURA_BUCKET
        - name: name
          value: saveImage
        - name: file-path
          value: users/user-${userid}/public/profile_image/${filename}
        - name: is-public
          value: "true"
        - name: sizes
          value: '[64, 400]'
    permissions:
      - role: instructor_access
      - role: user_access
  - name: sendSessionReminders
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: name
          value: sendSessionReminders
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
    permissions:
      - role: instructor_access
  - name: updateFromKeycloak
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_UPDATE_FROM_KEYCLOAK}}'
      forward_client_headers: true
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
    permissions:
      - role: instructor_access
      - role: user_access
  - name: updateUserAdminStatus
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: bucket
          value_from_env: HASURA_BUCKET
        - name: name
          value: updateAdminUser
  - name: validateFormbricksSurvey
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: name
          value: validateFormbricksSurvey
    permissions:
      - role: instructor_access
    comment: Validates a Formbricks survey and extracts add-on questions with pricing information
  - name: saveCourseFormbricksEnrollmentSurvey
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: name
          value: saveCourseFormbricksEnrollmentSurvey
    permissions:
      - role: instructor_access
    comment: Saves a course Formbricks survey URL after validating URL format and API token access
  - name: registerGuestForCourse
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: name
          value: registerGuestForCourse
    permissions:
      - role: anonymous
    comment: Starts an account-less guest registration for an event. Validates that the course opted in to guest registration, then stores a GUEST User and emails a double opt-in link. Creates no enrollment until that link is used.
  - name: confirmGuestRegistration
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: name
          value: confirmGuestRegistration
    permissions:
      - role: anonymous
    comment: Redeems a guest double opt-in token, creates the CourseEnrollment (which triggers the existing REGISTRATION_CONFIRMED mail) and returns a long-lived manage token.
  - name: manageGuestRegistration
    definition:
      kind: synchronous
      handler: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
      headers:
        - name: secret
          value_from_env: HASURA_CLOUD_FUNCTION_SECRET
        - name: name
          value: manageGuestRegistration
    permissions:
      - role: anonymous
    comment: Token-authenticated self-service for guests without a login - lists their registrations, cancels one, or erases all their personal data (GDPR Art. 15/17).
