- name: check_attendance
  webhook: '{{CLOUD_FUNCTION_LINK_CALL_PYTHON_FUNCTION}}'
  schedule: 0 0 * * *
  include_in_metadata: true
  payload: {}
  retry_conf:
    num_retries: 0
    retry_interval_seconds: 10
    timeout_seconds: 3699
    tolerance_seconds: 21600
  headers:
    - name: Function-Name
      value: check_attendance
    - name: Hasura-Secret
      value_from_env: HASURA_CLOUD_FUNCTION_SECRET
  comment: Regularly checks zoom and questionaire attendance
- name: send_questionaires
  webhook: '{{CLOUD_FUNCTION_LINK_SEND_QUESTIONAIRES}}'
  schedule: 0 */2 * * *
  include_in_metadata: true
  payload: {}
  headers:
    - name: secret
      value_from_env: HASURA_CLOUD_FUNCTION_SECRET
  comment: Sends out questionaires if necessary
- name: update_enrollment_locations
  webhook: '{{CLOUD_FUNCTION_LINK_CALL_PYTHON_FUNCTION}}'
  schedule: 0 3 * * *
  include_in_metadata: true
  payload: {}
  retry_conf:
    num_retries: 0
    retry_interval_seconds: 10
    timeout_seconds: 3699
    tolerance_seconds: 21600
  headers:
    - name: Function-Name
      value: update_enrollment_locations
    - name: Hasura-Secret
      value_from_env: HASURA_CLOUD_FUNCTION_SECRET
  comment: Updates CourseEnrollment.location based on attendance data from last 24 hours
- name: expire_job_postings
  webhook: '{{CLOUD_FUNCTION_LINK_CALL_PYTHON_FUNCTION}}'
  schedule: 30 2 * * *
  include_in_metadata: true
  payload: {}
  retry_conf:
    num_retries: 0
    retry_interval_seconds: 10
    timeout_seconds: 3699
    tolerance_seconds: 21600
  headers:
    - name: Function-Name
      value: expire_job_postings
    - name: Hasura-Secret
      value_from_env: HASURA_CLOUD_FUNCTION_SECRET
  comment: Flips PUBLISHED job postings past their expiresAt to EXPIRED (StuJo job board)
- name: send_job_alerts
  webhook: '{{CLOUD_FUNCTION_LINK_CALL_PYTHON_FUNCTION}}'
  schedule: 0 6 * * 1
  include_in_metadata: true
  payload: {}
  retry_conf:
    num_retries: 0
    retry_interval_seconds: 10
    timeout_seconds: 3699
    tolerance_seconds: 21600
  headers:
    - name: Function-Name
      value: send_job_alerts
    - name: Hasura-Secret
      value_from_env: HASURA_CLOUD_FUNCTION_SECRET
  comment: Sends the weekly StuJo job alert (Job-Letter) to subscribed users
