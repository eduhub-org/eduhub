table:
  name: SessionSpeaker
  schema: public
object_relationships:
  - name: User
    using:
      foreign_key_constraint_on: userId
  - name: Session
    using:
      foreign_key_constraint_on: sessionId
insert_permissions:
  - role: instructor_access
    permission:
      check:
        Session:
          Course:
            CourseInstructors:
              User:
                id:
                  _eq: X-Hasura-User-Id
      columns:
        - userId
        - sessionId
select_permissions:
  - role: anonymous
    permission:
      columns:
        - id
        - created_at
        - updated_at
        - userId
        - sessionId
      filter: {}
update_permissions:
  - role: instructor_access
    permission:
      columns:
        - userId
        - sessionId
      filter:
        Session:
          Course:
            CourseInstructors:
              User:
                id:
                  _eq: X-Hasura-User-Id
      check: null
delete_permissions:
  - role: instructor_access
    permission:
      filter:
        Session:
          Course:
            CourseInstructors:
              User:
                id:
                  _eq: X-Hasura-User-Id
