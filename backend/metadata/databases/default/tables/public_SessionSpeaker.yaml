table:
  name: SessionSpeaker
  schema: public
object_relationships:
  - name: User
    using:
      foreign_key_constraint_on: userId
  - name: Session
    using:
      foreign_key_constraint_on: sessionId
insert_permissions:
  - role: instructor_access
    permission:
      check:
        Session:
          Course:
            CourseInstructors:
              User:
                id:
                  _eq: X-Hasura-User-Id
      columns:
        - userId
        - sessionId
  - role: org_admin_access
    permission:
      check:
        Session:
          Course:
            Program:
              _or:
                - _and:
                    - type:
                        _eq: EVENTS
                    - Organization:
                        OrganizationAdmins:
                          _and:
                            - userId:
                                _eq: X-Hasura-User-Id
                            - canManageEvents:
                                _eq: true
                - _and:
                    - type:
                        _eq: COURSES
                    - Organization:
                        OrganizationAdmins:
                          _and:
                            - userId:
                                _eq: X-Hasura-User-Id
                            - canManageCourses:
                                _eq: true
                - _and:
                    - type:
                        _eq: DEGREES
                    - Organization:
                        OrganizationAdmins:
                          _and:
                            - userId:
                                _eq: X-Hasura-User-Id
                            - canManageDegrees:
                                _eq: true
                - Organization:
                    OrganizationAdmins:
                      _and:
                        - userId:
                            _eq: X-Hasura-User-Id
                        - canManageSettings:
                            _eq: true
      columns:
        - userId
        - sessionId
select_permissions:
  - role: anonymous
    permission:
      columns:
        - id
        - created_at
        - updated_at
        - userId
        - sessionId
      filter: {}
