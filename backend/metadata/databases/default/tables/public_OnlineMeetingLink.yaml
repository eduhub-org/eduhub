                              _and:
                                - userId:
                                    _eq: X-Hasura-User-Id
                                - canManageDegrees:
                                    _eq: true
                    - Organization:
                        OrganizationAdmins:
                          _and:
                            - userId:
                                _eq: X-Hasura-User-Id
                            - canManageSettings:
                                _eq: true
      columns:
        - courseLocationId
        - sessionAddressId
        - url
