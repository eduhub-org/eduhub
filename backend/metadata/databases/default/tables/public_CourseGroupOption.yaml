table:
  name: CourseGroupOption
  schema: public
object_relationships:
  - name: Organization
    using:
      foreign_key_constraint_on: organizationId
  - name: ProgramType
    using:
      foreign_key_constraint_on: programType
array_relationships:
  - name: CourseGroups
    using:
      foreign_key_constraint_on:
        column: groupOptionId
        table:
          name: CourseGroup
          schema: public
select_permissions:
  - role: api_proxy
    permission:
      columns:
        - id
        - title
        - sliderGroup
      filter: {}
  - role: anonymous
    permission:
      columns:
        - id
        - title
        - order
        - sliderGroup
        - programType
        - organizationId
        - created_at
        - updated_at
      filter: {}
