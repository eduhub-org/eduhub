table:
  name: CourseGroupOption
  schema: public
object_relationships:
  - name: Organization
    using:
      foreign_key_constraint_on: organizationId
  - name: ProgramType
    using:
      foreign_key_constraint_on: programType
array_relationships:
  - name: CourseGroups
    using:
      foreign_key_constraint_on:
        column: groupOptionId
        table:
          name: CourseGroup
          schema: public
  # For a project-slider row (contentType = PROJECT): the course groups it pulls projects from.
  - name: SelectedCourseGroups
    using:
      foreign_key_constraint_on:
        column: projectSliderOptionId
        table:
          name: ProjectSliderCourseGroup
          schema: public
  # For a project-slider row (contentType = PROJECT): the project groups it pulls projects from.
  - name: SelectedProjectGroups
    using:
      foreign_key_constraint_on:
        column: projectSliderOptionId
        table:
          name: ProjectSliderProjectGroup
          schema: public
  # For a job-slider row (contentType = JOB): the job posting types it pulls from.
  - name: SelectedJobTypes
    using:
      foreign_key_constraint_on:
        column: jobSliderOptionId
        table:
          name: JobSliderJobType
          schema: public
select_permissions:
  - role: anonymous
    permission:
      columns:
        - id
        - title
        - order
        - sliderGroup
        - contentType
        - programType
        - organizationId
        - created_at
        - updated_at
      filter: {}
