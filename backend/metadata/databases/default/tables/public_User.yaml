table:
  name: User
  schema: public
object_relationships:
  - name: Country
    using:
      foreign_key_constraint_on: country
  - name: Organization
    using:
      foreign_key_constraint_on: organizationId
  - name: UserOccupation
    using:
      foreign_key_constraint_on: occupation
  - name: UserStatus
    using:
      foreign_key_constraint_on: status
array_relationships:
  - name: AchievementOptionMentors
    using:
      foreign_key_constraint_on:
        column: userId
        table:
          name: AchievementOptionMentor
          schema: public
  - name: AchievementRecordAuthors
    using:
      foreign_key_constraint_on:
        column: userId
        table:
          name: AchievementRecordAuthor
          schema: public
  - name: Attendances
    using:
      foreign_key_constraint_on:
        column: userId
        table:
          name: Attendance
          schema: public
  - name: CourseEnrollments
    using:
      foreign_key_constraint_on:
        column: userId
        table:
          name: CourseEnrollment
          schema: public
  - name: Experts
    using:
      foreign_key_constraint_on:
        column: userId
        table:
          name: Expert
          schema: public
  - name: OrganizationAdmins
    using:
      foreign_key_constraint_on:
        column: userId
        table:
          name: OrganizationAdmin
          schema: public
select_permissions:
  - role: admin-ras
    permission:
      columns:
        - anonymousId
        - country
        - created_at
        - email
        - externalProfile
        - firstName
        - id
        - lastName
        - matriculationNumber
        - newsletterRegistration
        - occupation
        - picture
        - updated_at
        - zipCode
      filter: {}
  - role: anonymous
    permission:
      columns:
        - externalProfile
        - firstName
        - id
        - lastName
        - occupation
        - organizationId
        - picture
      filter: {}
      limit: 10
  - role: instructor_access
    permission:
      columns:
        - anonymousId
        - country
        - created_at
        - email
        - externalProfile
        - firstName
        - id
        - lastName
        - matriculationNumber
        - newsletterRegistration
        - occupation
        - picture
        - updated_at
        - zipCode
      filter: {}
      limit: 100
  - role: user_access
    permission:
      columns:
        - country
        - email
        - externalProfile
        - firstName
        - id
        - lastName
        - matriculationNumber
        - newsletterRegistration
        - occupation
        - organizationId
        - picture
        - status
        - zipCode
      filter:
        id:
          _eq: X-Hasura-User-Id
      limit: 10
update_permissions:
  - role: user_access
    permission:
      columns:
        - country
        - email
        - externalProfile
        - firstName
        - lastName
        - matriculationNumber
        - newsletterRegistration
        - occupation
        - organizationId
        - picture
        - zipCode
      filter:
        id:
          _eq: X-Hasura-User-Id
      check: null
event_triggers:
  - name: update_keycloak_user
    definition:
      enable_manual: false
      update:
        columns:
          - firstName
          - lastName
    retry_conf:
      interval_sec: 10
      num_retries: 5
      timeout_sec: 60
    webhook: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
    headers:
      - name: secret
        value_from_env: HASURA_CLOUD_FUNCTION_SECRET
      - name: name
        value: updateKeycloakUser
