table:
  name: User
  schema: public
object_relationships:
  - name: Country
    using:
      foreign_key_constraint_on: country
  - name: Organization
    using:
      foreign_key_constraint_on: organizationId
  - name: UserOccupation
    using:
      foreign_key_constraint_on: occupation
  - name: UserStatus
    using:
      foreign_key_constraint_on: status
array_relationships:
  - name: AchievementOptionMentors
    using:
      foreign_key_constraint_on:
        column: userId
        table:
          name: AchievementOptionMentor
          schema: public
  - name: AchievementRecordAuthors
    using:
      foreign_key_constraint_on:
        column: userId
        table:
          name: AchievementRecordAuthor
          schema: public
  - name: Attendances
    using:
      foreign_key_constraint_on:
        column: userId
        table:
          name: Attendance
          schema: public
  - name: CourseEnrollments
    using:
      foreign_key_constraint_on:
        column: userId
        table:
          name: CourseEnrollment
          schema: public
  - name: CourseInstructors
    using:
      foreign_key_constraint_on:
        column: userId
        table:
          name: CourseInstructor
          schema: public
  - name: OrganizationAdmins
    using:
      foreign_key_constraint_on:
        column: userId
        table:
          name: OrganizationAdmin
          schema: public
  - name: SessionSpeakers
    using:
      foreign_key_constraint_on:
        column: userId
        table:
          name: SessionSpeaker
          schema: public
  - name: OrganizationNewsletterSubscriptions
    using:
      foreign_key_constraint_on:
        column: userId
        table:
          name: OrganizationNewsletterSubscription
          schema: public
  - name: ProjectAuthors
    using:
      foreign_key_constraint_on:
        column: userId
        table:
          name: ProjectAuthor
          schema: public
  - name: ProjectMentors
    using:
      foreign_key_constraint_on:
        column: userId
        table:
          name: ProjectMentor
          schema: public
  - name: ProposedProjects
    using:
      foreign_key_constraint_on:
        column: proposedByUserId
        table:
          name: Project
          schema: public
select_permissions:
  - role: anonymous
    permission:
      columns:
        - externalProfile
        - firstName
        - id
        - lastName
        - occupation
        - organizationId
        - picture
      # Was `filter: {}`, which made every registered user's name and picture
      # readable by anyone, logged out, whether or not they had ever appeared on
      # a public page. Anonymous only ever needs the people a public page
      # actually renders, so each branch below mirrors the permission of the
      # table that puts them there - the visibility of a person can never be
      # broader than the row that made them public.
      filter:
        _or:
          # Course instructors, shown on the course page. The published
          # clauses have to be written out here: CourseInstructor.anonymous is
          # `filter: {}`, and a relationship predicate inside a permission does
          # not apply the related table's own permission, so a bare
          # `CourseInstructors: {}` would still expose the instructors of an
          # unpublished course. The two project branches below are already
          # written this way.
          - CourseInstructors:
              Course:
                _and:
                  - published:
                      _eq: true
                  - Program:
                      published:
                        _eq: true
          # Session speakers, shown in the agenda, bounded the same way through
          # the session's course.
          - SessionSpeakers:
              Session:
                Course:
                  _and:
                    - published:
                        _eq: true
                    - Program:
                        published:
                          _eq: true
          # Accepted authors of a published showcase (ProjectAuthor.anonymous).
          - ProjectAuthors:
              _and:
                - participationStatus:
                    _eq: ACCEPTED
                - Project:
                    published:
                      _eq: true
          # Mentors of a published project or of an open proposal, where they
          # are the listed contact (ProjectMentor.anonymous).
          - ProjectMentors:
              Project:
                _or:
                  - published:
                      _eq: true
                  - _and:
                      - status:
                          _eq: PROPOSED
                      - _not:
                          ProjectAuthors:
                            participationStatus:
                              _eq: ACCEPTED
      limit: 10
  - role: instructor_access
    permission:
      columns:
        - addressLine1
        - addressLine2
        - anonymousId
        - city
        - country
        - created_at
        - email
        - externalProfile
        - firstName
        - id
        - lastName
        - matriculationNumber
        - matrixUserHandle
        - newsletterRegistration
        - occupation
        - picture
        - status
        - updated_at
        - zipCode
      filter: {}
      limit: 100
  - role: user_access
    permission:
      columns:
        - addressLine1
        - addressLine2
        - city
        - country
        - email
        - externalProfile
        - firstName
        - id
        - lastName
        - matriculationNumber
        - matrixUserHandle
        - newsletterRegistration
        - occupation
        - organizationId
        - picture
        - status
        - updated_at
        - zipCode
      filter:
        id:
          _eq: X-Hasura-User-Id
      limit: 10
  # Split across inherited roles: `user` JWT inherits both user_access and user_access_others;
  # Hasura merges union semantics — classmates visible via projects stay limited columns only.
  - role: user_access_others
    permission:
      columns:
        - externalProfile
        - firstName
        - id
        - lastName
        - matrixUserHandle
        - organizationId
        - picture
      filter:
        _or:
          # Project co-authors, as before.
          - ProjectAuthors:
              _and:
                - participationStatus:
                    _eq: ACCEPTED
                - Project:
                    ProjectCourses:
                      Course:
                        CourseEnrollments:
                          _and:
                            - User:
                                id:
                                  _eq: X-Hasura-User-Id
                            - status:
                                _eq: CONFIRMED
          # Fellow participants of a course you are taking part in yourself.
          # matrixUserHandle rides along so the directory can offer a direct
          # message; it is a chat handle inside a room these two already share,
          # not a contact detail like email, which stays out of this role.
          - CourseEnrollments:
              _and:
                - status:
                    _in:
                      - CONFIRMED
                      - COMPLETED
                - Course:
                    CourseEnrollments:
                      _and:
                        - userId:
                            _eq: X-Hasura-User-Id
                        - status:
                            _in:
                              - CONFIRMED
                              - COMPLETED
          # Instructors and speakers of a course you are taking part in. The
          # anonymous branches above are bounded to published courses, and an
          # instructor is not enrolled in their own course, so without these two
          # a participant would lose the teaching staff on a course that is not
          # (or not yet) public - exactly the courses where the staff matters
          # most to the people already in them.
          - CourseInstructors:
              Course:
                CourseEnrollments:
                  _and:
                    - userId:
                        _eq: X-Hasura-User-Id
                    - status:
                        _in:
                          - CONFIRMED
                          - COMPLETED
          - SessionSpeakers:
              Session:
                Course:
                  CourseEnrollments:
                    _and:
                      - userId:
                          _eq: X-Hasura-User-Id
                      - status:
                          _in:
                            - CONFIRMED
                            - COMPLETED
      limit: 100
  # Org admins with canManageSettings may read contact details of users they administer (and their
  # own record) when managing an organization's admin team on /manage/settings/access. status/updated_at
  # /zipCode/country are needed by the shared user-search picker (SelectUserDialog, also used to add
  # course instructors); the row filter still masks these values for users they do not administer.
  - role: org_admin_access
    permission:
      columns:
        - id
        - firstName
        - lastName
        - email
        - zipCode
        - country
        - status
        - updated_at
      filter:
        _or:
          - id:
              _eq: X-Hasura-User-Id
          - OrganizationAdmins:
              Organization:
                OrganizationAdmins:
                  _and:
                    - userId:
                        _eq: X-Hasura-User-Id
                    - canManageSettings:
                        _eq: true
      limit: 100
      # The admin table on /manage/settings/access is paginated and reads User_aggregate { count }.
      allow_aggregations: true
update_permissions:
  - role: user_access
    permission:
      columns:
        - addressLine1
        - addressLine2
        - city
        - country
        - email
        - externalProfile
        - firstName
        - lastName
        - matriculationNumber
        - newsletterRegistration
        - occupation
        - organizationId
        - picture
        - zipCode
      filter:
        id:
          _eq: X-Hasura-User-Id
      check: null
event_triggers:
  - name: update_keycloak_user
    definition:
      enable_manual: false
      update:
        columns:
          - firstName
          - lastName
          - picture
    retry_conf:
      interval_sec: 10
      num_retries: 5
      timeout_sec: 60
    webhook: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
    headers:
      - name: secret
        value_from_env: HASURA_CLOUD_FUNCTION_SECRET
      - name: name
        value: updateKeycloakUser
