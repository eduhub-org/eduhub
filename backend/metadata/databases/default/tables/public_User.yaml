table:
  name: User
  schema: public
object_relationships:
  - name: Country
    using:
      foreign_key_constraint_on: country
  - name: Organization
    using:
      foreign_key_constraint_on: organizationId
  - name: UserOccupation
    using:
      foreign_key_constraint_on: occupation
  - name: UserStatus
    using:
      foreign_key_constraint_on: status
array_relationships:
  - name: AchievementOptionMentors
    using:
      foreign_key_constraint_on:
        column: userId
        table:
          name: AchievementOptionMentor
          schema: public
  - name: AchievementRecordAuthors
    using:
      foreign_key_constraint_on:
        column: userId
        table:
          name: AchievementRecordAuthor
          schema: public
  - name: Attendances
    using:
      foreign_key_constraint_on:
        column: userId
        table:
          name: Attendance
          schema: public
  - name: CourseEnrollments
    using:
      foreign_key_constraint_on:
        column: userId
        table:
          name: CourseEnrollment
          schema: public
  - name: CourseInstructors
    using:
      foreign_key_constraint_on:
        column: userId
        table:
          name: CourseInstructor
          schema: public
  - name: OrganizationAdmins
    using:
      foreign_key_constraint_on:
        column: userId
        table:
          name: OrganizationAdmin
          schema: public
  - name: SessionSpeakers
    using:
      foreign_key_constraint_on:
        column: userId
        table:
          name: SessionSpeaker
          schema: public
  - name: OrganizationNewsletterSubscriptions
    using:
      foreign_key_constraint_on:
        column: userId
        table:
          name: OrganizationNewsletterSubscription
          schema: public
  - name: ProjectAuthors
    using:
      foreign_key_constraint_on:
        column: userId
        table:
          name: ProjectAuthor
          schema: public
  - name: ProjectMentors
    using:
      foreign_key_constraint_on:
        column: userId
        table:
          name: ProjectMentor
          schema: public
  - name: ProposedProjects
    using:
      foreign_key_constraint_on:
        column: proposedByUserId
        table:
          name: Project
          schema: public
select_permissions:
  - role: api_proxy
    permission:
      columns:
        - id
        - firstName
        - lastName
        - email
      filter: {}
  - role: anonymous
    permission:
      columns:
        - externalProfile
        - firstName
        - id
        - lastName
        - occupation
        - organizationId
        - picture
      filter: {}
      limit: 10
  - role: instructor_access
    permission:
      columns:
        - addressLine1
        - addressLine2
        - anonymousId
        - city
        - country
        - created_at
        - email
        - externalProfile
        - firstName
        - id
        - lastName
        - matriculationNumber
        - matrixUserHandle
        - newsletterRegistration
        - occupation
        - picture
        - status
        - updated_at
        - zipCode
      filter: {}
      limit: 100
  - role: user_access
    permission:
      columns:
        - addressLine1
        - addressLine2
        - city
        - country
        - email
        - externalProfile
        - firstName
        - id
        - lastName
        - matriculationNumber
        - matrixUserHandle
        - newsletterRegistration
        - occupation
        - organizationId
        - picture
        - status
        - updated_at
        - zipCode
      filter:
        id:
          _eq: X-Hasura-User-Id
      limit: 10
  # Split across inherited roles: `user` JWT inherits both user_access and user_access_others;
  # Hasura merges union semantics — classmates visible via projects stay limited columns only.
  - role: user_access_others
    permission:
      columns:
        - externalProfile
        - firstName
        - id
        - lastName
        - organizationId
        - picture
      filter:
        ProjectAuthors:
          _and:
            - participationStatus:
                _eq: ACCEPTED
            - Project:
                ProjectCourses:
                  Course:
                    CourseEnrollments:
                      _and:
                        - User:
                            id:
                              _eq: X-Hasura-User-Id
                        - status:
                            _eq: CONFIRMED
      limit: 100
  # Org admins with canManageSettings may read contact details of users they administer (and their
  # own record) when managing an organization's admin team on /manage/admin-users. status/updated_at
  # /zipCode/country are needed by the shared user-search picker (SelectUserDialog, also used to add
  # course instructors); the row filter still masks these values for users they do not administer.
  - role: org_admin_access
    permission:
      columns:
        - id
        - firstName
        - lastName
        - email
        - zipCode
        - country
        - status
        - updated_at
      filter:
        _or:
          - id:
              _eq: X-Hasura-User-Id
          - OrganizationAdmins:
              Organization:
                OrganizationAdmins:
                  _and:
                    - userId:
                        _eq: X-Hasura-User-Id
                    - canManageSettings:
                        _eq: true
      limit: 100
update_permissions:
  - role: user_access
    permission:
      columns:
        - addressLine1
        - addressLine2
        - city
        - country
        - email
        - externalProfile
        - firstName
        - lastName
        - matriculationNumber
        - newsletterRegistration
        - occupation
        - organizationId
        - picture
        - zipCode
      filter:
        id:
          _eq: X-Hasura-User-Id
      check: null
event_triggers:
  - name: update_keycloak_user
    definition:
      enable_manual: false
      update:
        columns:
          - firstName
          - lastName
          - picture
    retry_conf:
      interval_sec: 10
      num_retries: 5
      timeout_sec: 60
    webhook: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
    headers:
      - name: secret
        value_from_env: HASURA_CLOUD_FUNCTION_SECRET
      - name: name
        value: updateKeycloakUser
