table:
  name: ProjectGroupOption
  schema: public
object_relationships:
  - name: Organization
    using:
      foreign_key_constraint_on: organizationId
array_relationships:
  - name: ProjectGroups
    using:
      foreign_key_constraint_on:
        column: groupOptionId
        table:
          name: ProjectGroup
          schema: public
  - name: ProjectSliderProjectGroups
    using:
      foreign_key_constraint_on:
        column: projectGroupOptionId
        table:
          name: ProjectSliderProjectGroup
          schema: public
select_permissions:
  - role: anonymous
    permission:
      columns:
        - id
        - title
        - order
        - organizationId
        - created_at
        - updated_at
      filter: {}
