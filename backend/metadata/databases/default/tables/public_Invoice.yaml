table:
  name: Invoice
  schema: public
object_relationships:
  - name: Organization
    using:
      foreign_key_constraint_on: organizationId
  - name: User
    using:
      foreign_key_constraint_on: userId
  - name: CourseEnrollment
    using:
      foreign_key_constraint_on: courseEnrollmentId
  - name: InvoiceStatus
    using:
      foreign_key_constraint_on: status
  - name: JobPosting
    using:
      foreign_key_constraint_on: jobPostingId
select_permissions:
  - role: user_access
    permission:
      columns:
        - courseEnrollmentId
        - created_at
        - currency
        - grossTotal
        - id
        - invoiceDate
        - invoiceNumber
        - jobPostingId
        - netTotal
        - organizationId
        - status
        - stripeHostedInvoiceUrl
        - stripeInvoicePdfUrl
        - stripeInvoiceId
        - updated_at
        - userId
        - vatTotal
      filter:
        userId:
          _eq: X-Hasura-User-Id
      allow_aggregations: true
  # Employers see invoices for their organization's job postings.
  - role: org_admin_access
    permission:
      columns:
        - created_at
        - currency
        - grossTotal
        - id
        - invoiceDate
        - invoiceNumber
        - jobPostingId
        - netTotal
        - organizationId
        - status
        - stripeHostedInvoiceUrl
        - stripeInvoicePdfUrl
        - stripeInvoiceId
        - updated_at
        - userId
        - vatTotal
      filter:
        JobPosting:
          Organization:
            OrganizationAdmins:
              _and:
                - userId:
                    _eq: X-Hasura-User-Id
                - canManageJobs:
                    _eq: true
      allow_aggregations: true
  - role: instructor_access
    permission:
      columns:
        - courseEnrollmentId
        - created_at
        - currency
        - grossTotal
        - id
        - invoiceDate
        - invoiceNumber
        - netTotal
        - organizationId
        - status
        - stripeHostedInvoiceUrl
        - stripeInvoicePdfUrl
        - stripeInvoiceId
        - updated_at
        - userId
        - vatTotal
      filter:
        CourseEnrollment:
          Course:
            CourseInstructors:
              userId:
                _eq: X-Hasura-User-Id
      allow_aggregations: true
