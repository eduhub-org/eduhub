table:
  name: ProjectGroup
  schema: public
object_relationships:
  - name: Project
    using:
      foreign_key_constraint_on: projectId
  - name: ProjectGroupOption
    using:
      foreign_key_constraint_on: groupOptionId
select_permissions:
  - role: anonymous
    permission:
      columns:
        - id
        - projectId
        - groupOptionId
        - created_at
        - updated_at
      filter: {}
