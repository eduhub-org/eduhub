table:
  name: Session
  schema: public
object_relationships:
  - name: Course
    using:
      foreign_key_constraint_on: courseId
  - name: Program
    using:
      foreign_key_constraint_on: programId
array_relationships:
  - name: Attendances
    using:
      foreign_key_constraint_on:
        column: sessionId
        table:
          name: Attendance
          schema: public
  - name: SessionAddresses
    using:
      foreign_key_constraint_on:
        column: sessionId
        table:
          name: SessionAddress
          schema: public
  - name: SessionSpeakers
    using:
      foreign_key_constraint_on:
        column: sessionId
        table:
          name: SessionSpeaker
          schema: public
insert_permissions:
  - role: instructor_access
    permission:
      check:
        Course:
          CourseInstructors:
            User:
              id:
                _eq: X-Hasura-User-Id
      columns:
        - courseId
        - description
        - endDateTime
        - id
        - isMandatory
        - startDateTime
        - title
  # Program sessions are managed by organization admins with the capability
  # for the program's type. courseId is not insertable, so the CHECK
  # constraint Session_course_xor_program forces a program session.
  - role: org_admin_access
    permission:
      check:
        _or:
          - Program:
              _or:
                - _and:
                    - type:
                        _eq: EVENTS
                    - Organization:
                        OrganizationAdmins:
                          _and:
                            - userId:
                                _eq: X-Hasura-User-Id
                            - canManageEvents:
                                _eq: true
                - _and:
                    - type:
                        _eq: COURSES
                    - Organization:
                        OrganizationAdmins:
                          _and:
                            - userId:
                                _eq: X-Hasura-User-Id
                            - canManageCourses:
                                _eq: true
                - _and:
                    - type:
                        _eq: DEGREES
                    - Organization:
                        OrganizationAdmins:
                          _and:
                            - userId:
                                _eq: X-Hasura-User-Id
                            - canManageDegrees:
                                _eq: true
                - Organization:
                    OrganizationAdmins:
                      _and:
                        - userId:
                            _eq: X-Hasura-User-Id
                        - canManageSettings:
                            _eq: true
          - Course:
              Program:
                _or:
                  - _and:
                      - type:
                          _eq: EVENTS
                      - Organization:
                          OrganizationAdmins:
                            _and:
                              - userId:
                                  _eq: X-Hasura-User-Id
                              - canManageEvents:
                                  _eq: true
                  - _and:
                      - type:
                          _eq: COURSES
                      - Organization:
                          OrganizationAdmins:
                            _and:
                              - userId:
                                  _eq: X-Hasura-User-Id
                              - canManageCourses:
                                  _eq: true
                  - _and:
                      - type:
                          _eq: DEGREES
                      - Organization:
                          OrganizationAdmins:
                            _and:
                              - userId:
                                  _eq: X-Hasura-User-Id
                              - canManageDegrees:
                                  _eq: true
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageSettings:
                              _eq: true
      columns:
        - description
        - endDateTime
        - isMandatory
        - programId
        - startDateTime
        - title
        - courseId
        - id
select_permissions:
  - role: anonymous
    permission:
      columns:
        - courseId
        - created_at
        - description
        - endDateTime
        - id
        - isMandatory
        - programId
        - startDateTime
        - title
        - updated_at
      filter: {}
  - role: instructor_access
    permission:
      columns:
        - attendanceData
        - courseId
        - created_at
        - description
        - endDateTime
        - id
        - isMandatory
        - programId
        - startDateTime
        - title
        - updated_at
      filter:
        Course:
          CourseInstructors:
            User:
              id:
                _eq: X-Hasura-User-Id
  # Program sessions of the admin's organizations, and - for the course management page - the
  # sessions of courses whose program type the admin may manage (course sessions have no programId).
  - role: org_admin_access
    permission:
      columns:
        - attendanceData
        - courseId
        - created_at
        - description
        - endDateTime
        - id
        - isMandatory
        - programId
        - startDateTime
        - title
        - updated_at
      filter:
        _or:
          - Program:
              Organization:
                OrganizationAdmins:
                  userId:
                    _eq: X-Hasura-User-Id
          - Course:
              Program:
                _or:
                  - _and:
                      - type:
                          _eq: EVENTS
                      - Organization:
                          OrganizationAdmins:
                            _and:
                              - userId:
                                  _eq: X-Hasura-User-Id
                              - canManageEvents:
                                  _eq: true
                  - _and:
                      - type:
                          _eq: COURSES
                      - Organization:
                          OrganizationAdmins:
                            _and:
                              - userId:
                                  _eq: X-Hasura-User-Id
                              - canManageCourses:
                                  _eq: true
                  - _and:
                      - type:
                          _eq: DEGREES
                      - Organization:
                          OrganizationAdmins:
                            _and:
                              - userId:
                                  _eq: X-Hasura-User-Id
                              - canManageDegrees:
                                  _eq: true
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageSettings:
                              _eq: true
