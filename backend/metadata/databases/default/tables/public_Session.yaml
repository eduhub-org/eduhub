                - Organization:
                    OrganizationAdmins:
                      _and:
                        - userId:
                            _eq: X-Hasura-User-Id
                        - canManageCourses:
                            _eq: true
            - _and:
                - type:
                    _eq: DEGREES
                - Organization:
                    OrganizationAdmins:
                      _and:
                        - userId:
                            _eq: X-Hasura-User-Id
                        - canManageDegrees:
                            _eq: true
            # A settings admin manages every program type for their organization (no type constraint).
            - Organization:
                OrganizationAdmins:
                  _and:
                    - userId:
                        _eq: X-Hasura-User-Id
                    - canManageSettings:
                        _eq: true
