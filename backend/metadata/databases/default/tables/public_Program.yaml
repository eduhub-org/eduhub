table:
  name: Program
  schema: public
object_relationships:
  - name: DefaultProjectType
    using:
      foreign_key_constraint_on: defaultProjectType
  - name: Organization
    using:
      foreign_key_constraint_on: organizationId
  - name: ProgramType
    using:
      foreign_key_constraint_on: type
  - name: AttendanceCertificateTemplate
    using:
      foreign_key_constraint_on: attendanceCertificateTemplateId
array_relationships:
  - name: Courses
    using:
      foreign_key_constraint_on:
        column: programId
        table:
          name: Course
          schema: public
select_permissions:
  - role: api_proxy
    permission:
      columns:
        - applicationStart
        - id
        - published
        - shortTitle
        - title
        - type
      filter: {}
  - role: anonymous
    permission:
      columns:
        - achievementRecordUploadDeadline
        - applicationStart
        - defaultApplicationEnd
        - defaultProjectSubmissionDeadline
        - defaultProjectType
        - projectProposalsEnabledByDefault
        - showExtendedApplicationPeriodBanner
        - id
        - lectureEnd
        - organizationId
        - lectureStart
        - published
        - shortTitle
        - title
        - type
        - visibility
        - defaultFormbricksEnrollmentSurveyUrl
      filter: {}
  - role: instructor_access
    permission:
      columns:
        - achievementRecordUploadDeadline
        - visibility
        - applicationStart
        - organizationId
        - attendanceCertificateTemplateId
        - attendanceCertificateTemplateURL
        - closingQuestionnaire
        - defaultApplicationEnd
        - defaultMaxMissedSessions
        - defaultProjectSubmissionDeadline
        - defaultProjectType
        - projectProposalsEnabledByDefault
        - id
        - lectureEnd
        - lectureStart
        - achievementCertificateTemplateURL
        - published
        - shortTitle
        - speakerQuestionnaire
        - startQuestionnaire
        - title
        - defaultFormbricksEnrollmentSurveyUrl
        - matrixSpaceId
        - matrixInstructorRoomId
        - showExtendedApplicationPeriodBanner
      filter: {}
  # Org admins can see every program of any organization they administer (all types), so they have
  # full context. Which ones they may create/edit/delete is gated per program type below.
  - role: org_admin_access
    permission:
      columns:
        - achievementRecordUploadDeadline
        - applicationStart
        - attendanceCertificateTemplateId
        - attendanceCertificateTemplateURL
        - achievementCertificateTemplateURL
        - closingQuestionnaire
        - defaultApplicationEnd
        - defaultMaxMissedSessions
        - defaultProjectSubmissionDeadline
        - defaultProjectType
        - defaultFormbricksEnrollmentSurveyUrl
        - id
        - lectureEnd
        - lectureStart
        - matrixSpaceId
        - matrixInstructorRoomId
        - organizationId
        - projectProposalsEnabledByDefault
        - published
        - shortTitle
        - showExtendedApplicationPeriodBanner
        - speakerQuestionnaire
        - startQuestionnaire
        - title
        - type
        - visibility
      filter:
        Organization:
          OrganizationAdmins:
            userId:
              _eq: X-Hasura-User-Id
      # ProgramList reads Program_aggregate { count }, so org admins need aggregations.
      allow_aggregations: true
update_permissions:
  # Editing a program requires the matching per-type capability on the admin's row for the
  # program's organization. `type`, `id` and `organizationId` are excluded so the program cannot
  # be moved out of the admin's scope.
  - role: org_admin_access
    permission:
      columns:
        - achievementRecordUploadDeadline
        - applicationStart
        - attendanceCertificateTemplateId
        - attendanceCertificateTemplateURL
        - achievementCertificateTemplateURL
        - closingQuestionnaire
        - defaultApplicationEnd
        - defaultMaxMissedSessions
        - defaultProjectSubmissionDeadline
        - defaultProjectType
        - defaultFormbricksEnrollmentSurveyUrl
        - lectureEnd
        - lectureStart
        - projectProposalsEnabledByDefault
        - published
        - shortTitle
        - showExtendedApplicationPeriodBanner
        - speakerQuestionnaire
        - startQuestionnaire
        - title
        - visibility
      filter:
        _or:
          - _and:
              - type:
                  _eq: EVENTS
              - Organization:
                  OrganizationAdmins:
                    _and:
                      - userId:
                          _eq: X-Hasura-User-Id
                      - canManageEvents:
                          _eq: true
          - _and:
              - type:
                  _eq: COURSES
              - Organization:
                  OrganizationAdmins:
                    _and:
                      - userId:
                          _eq: X-Hasura-User-Id
                      - canManageCourses:
                          _eq: true
          - _and:
              - type:
                  _eq: DEGREES
              - Organization:
                  OrganizationAdmins:
                    _and:
                      - userId:
                          _eq: X-Hasura-User-Id
                      - canManageDegrees:
                          _eq: true
      check:
        _or:
          - _and:
              - type:
                  _eq: EVENTS
              - Organization:
                  OrganizationAdmins:
                    _and:
                      - userId:
                          _eq: X-Hasura-User-Id
                      - canManageEvents:
                          _eq: true
          - _and:
              - type:
                  _eq: COURSES
              - Organization:
                  OrganizationAdmins:
                    _and:
                      - userId:
                          _eq: X-Hasura-User-Id
                      - canManageCourses:
                          _eq: true
          - _and:
              - type:
                  _eq: DEGREES
              - Organization:
                  OrganizationAdmins:
                    _and:
                      - userId:
                          _eq: X-Hasura-User-Id
                      - canManageDegrees:
                          _eq: true
insert_permissions:
  # A new program may only be created in an organization the admin manages, and only of a type
  # they are allowed to manage (the check reuses the same per-type scope as update).
  - role: org_admin_access
    permission:
      columns:
        - achievementRecordUploadDeadline
        - applicationStart
        - attendanceCertificateTemplateId
        - attendanceCertificateTemplateURL
        - achievementCertificateTemplateURL
        - closingQuestionnaire
        - defaultApplicationEnd
        - defaultMaxMissedSessions
        - defaultProjectSubmissionDeadline
        - defaultProjectType
        - defaultFormbricksEnrollmentSurveyUrl
        - lectureEnd
        - lectureStart
        - organizationId
        - projectProposalsEnabledByDefault
        - published
        - shortTitle
        - showExtendedApplicationPeriodBanner
        - speakerQuestionnaire
        - startQuestionnaire
        - title
        - type
        - visibility
      check:
        _or:
          - _and:
              - type:
                  _eq: EVENTS
              - Organization:
                  OrganizationAdmins:
                    _and:
                      - userId:
                          _eq: X-Hasura-User-Id
                      - canManageEvents:
                          _eq: true
          - _and:
              - type:
                  _eq: COURSES
              - Organization:
                  OrganizationAdmins:
                    _and:
                      - userId:
                          _eq: X-Hasura-User-Id
                      - canManageCourses:
                          _eq: true
          - _and:
              - type:
                  _eq: DEGREES
              - Organization:
                  OrganizationAdmins:
                    _and:
                      - userId:
                          _eq: X-Hasura-User-Id
                      - canManageDegrees:
                          _eq: true
delete_permissions:
  - role: org_admin_access
    permission:
      filter:
        _or:
          - _and:
              - type:
                  _eq: EVENTS
              - Organization:
                  OrganizationAdmins:
                    _and:
                      - userId:
                          _eq: X-Hasura-User-Id
                      - canManageEvents:
                          _eq: true
          - _and:
              - type:
                  _eq: COURSES
              - Organization:
                  OrganizationAdmins:
                    _and:
                      - userId:
                          _eq: X-Hasura-User-Id
                      - canManageCourses:
                          _eq: true
          - _and:
              - type:
                  _eq: DEGREES
              - Organization:
                  OrganizationAdmins:
                    _and:
                      - userId:
                          _eq: X-Hasura-User-Id
                      - canManageDegrees:
                          _eq: true
