table:
  name: Program
  schema: public
object_relationships:
  - name: Organization
    using:
      foreign_key_constraint_on: organizationId
  - name: ProgramType
    using:
      foreign_key_constraint_on: type
array_relationships:
  - name: CertificateTemplatePrograms
    using:
      foreign_key_constraint_on:
        column: programId
        table:
          name: CertificateTemplateProgram
          schema: public
  - name: Courses
    using:
      foreign_key_constraint_on:
        column: programId
        table:
          name: Course
          schema: public
select_permissions:
  - role: anonymous
    permission:
      columns:
        - achievementRecordUploadDeadline
        - applicationStart
        - defaultApplicationEnd
        - id
        - lectureEnd
        - organizationId
        - lectureStart
        - published
        - shortTitle
        - title
        - type
        - visibility
        - defaultFormbricksEnrollmentSurveyUrl
        - showExtendedApplicationBanner
      filter: {}
  - role: instructor_access
    permission:
      columns:
        - achievementRecordUploadDeadline
        - visibility
        - applicationStart
        - organizationId
        - attendanceCertificateTemplateURL
        - closingQuestionnaire
        - defaultApplicationEnd
        - defaultMaxMissedSessions
        - id
        - lectureEnd
        - lectureStart
        - achievementCertificateTemplateURL
        - published
        - shortTitle
        - speakerQuestionnaire
        - startQuestionnaire
        - title
        - defaultFormbricksEnrollmentSurveyUrl
        - matrixSpaceId
        - matrixInstructorRoomId
        - showExtendedApplicationBanner
      filter: {}
update_permissions:
  - role: admin
    permission:
      columns:
        - showExtendedApplicationBanner
      filter: {}
      check: null
