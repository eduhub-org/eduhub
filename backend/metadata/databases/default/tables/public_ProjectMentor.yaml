table:
  name: ProjectMentor
  schema: public
object_relationships:
  - name: Project
    using:
      foreign_key_constraint_on: projectId
  - name: User
    using:
      foreign_key_constraint_on: userId
insert_permissions:
  - role: instructor_access
    permission:
      check:
        Project:
          ProjectCourses:
            Course:
              CourseInstructors:
                User:
                  id:
                    _eq: X-Hasura-User-Id
      columns:
        - created_at
        - id
        - projectId
        - updated_at
        - userId
  - role: org_admin_access
    permission:
      check:
        Project:
          ProjectCourses:
            Course:
              Program:
                _or:
                  - _and:
                      - type:
                          _eq: EVENTS
                      - Organization:
                          OrganizationAdmins:
                            _and:
                              - userId:
                                  _eq: X-Hasura-User-Id
                              - canManageEvents:
                                  _eq: true
                  - _and:
                      - type:
                          _eq: COURSES
                      - Organization:
                          OrganizationAdmins:
                            _and:
                              - userId:
                                  _eq: X-Hasura-User-Id
                              - canManageCourses:
                                  _eq: true
                  - _and:
                      - type:
                          _eq: DEGREES
                      - Organization:
                          OrganizationAdmins:
                            _and:
                              - userId:
                                  _eq: X-Hasura-User-Id
                              - canManageDegrees:
                                  _eq: true
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageSettings:
                              _eq: true
      columns:
        - created_at
        - id
        - projectId
        - updated_at
        - userId
select_permissions:
  # Mentors are public for any anonymously-visible project (a published showcase
  # or an open PROPOSED template), so the mentor line renders on public template
  # tiles and pages. Authors stay accepted-authors-of-published-only (see
  # public_ProjectAuthor.yaml).
  - role: anonymous
    permission:
      columns:
        - created_at
        - id
        - projectId
        - updated_at
        - userId
      filter:
        Project:
          _or:
            - published:
                _eq: true
            - _and:
                - status:
                    _eq: PROPOSED
                - _not:
                    ProjectAuthors:
                      participationStatus:
                        _eq: ACCEPTED
  - role: instructor_access
    permission:
      columns:
        - created_at
        - id
        - projectId
        - updated_at
        - userId
      filter:
        Project:
          _or:
            - ProjectCourses:
                Course:
                  CourseInstructors:
                    User:
                      id:
                        _eq: X-Hasura-User-Id
            - ProjectMentors:
                User:
                  id:
                    _eq: X-Hasura-User-Id
  - role: user_access
    permission:
      columns:
        - created_at
        - id
        - projectId
        - updated_at
        - userId
      filter:
        Project:
          _or:
            - ProjectAuthors:
                User:
                  id:
                    _eq: X-Hasura-User-Id
            - ProjectCourses:
                Course:
                  CourseEnrollments:
                    User:
                      id:
                        _eq: X-Hasura-User-Id
  - role: org_admin_access
    permission:
      columns:
        - created_at
        - id
        - projectId
        - updated_at
        - userId
      filter:
        Project:
          _or:
            - ProjectCourses:
                Course:
                  Program:
                    _or:
                      - _and:
                          - type:
                              _eq: EVENTS
                          - Organization:
                              OrganizationAdmins:
                                _and:
                                  - userId:
                                      _eq: X-Hasura-User-Id
                                  - canManageEvents:
                                      _eq: true
                      - _and:
                          - type:
                              _eq: COURSES
                          - Organization:
                              OrganizationAdmins:
                                _and:
                                  - userId:
                                      _eq: X-Hasura-User-Id
                                  - canManageCourses:
                                      _eq: true
                      - _and:
                          - type:
                              _eq: DEGREES
                          - Organization:
                              OrganizationAdmins:
                                _and:
                                  - userId:
                                      _eq: X-Hasura-User-Id
                                  - canManageDegrees:
                                      _eq: true
                      - Organization:
                          OrganizationAdmins:
                            _and:
                              - userId:
                                  _eq: X-Hasura-User-Id
                              - canManageSettings:
                                  _eq: true
            - ProjectMentors:
                User:
                  id:
                    _eq: X-Hasura-User-Id
update_permissions:
  - role: instructor_access
    permission:
      columns: []
      filter:
        Project:
          ProjectCourses:
            Course:
              CourseInstructors:
                User:
                  id:
                    _eq: X-Hasura-User-Id
      check: null
  - role: org_admin_access
    permission:
      columns: []
      filter:
        Project:
          ProjectCourses:
            Course:
              Program:
                _or:
                  - _and:
                      - type:
                          _eq: EVENTS
                      - Organization:
                          OrganizationAdmins:
                            _and:
                              - userId:
                                  _eq: X-Hasura-User-Id
                              - canManageEvents:
                                  _eq: true
                  - _and:
                      - type:
                          _eq: COURSES
                      - Organization:
                          OrganizationAdmins:
                            _and:
                              - userId:
                                  _eq: X-Hasura-User-Id
                              - canManageCourses:
                                  _eq: true
                  - _and:
                      - type:
                          _eq: DEGREES
                      - Organization:
                          OrganizationAdmins:
                            _and:
                              - userId:
                                  _eq: X-Hasura-User-Id
                              - canManageDegrees:
                                  _eq: true
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageSettings:
                              _eq: true
      check: null
delete_permissions:
  - role: instructor_access
    permission:
      filter:
        Project:
          ProjectCourses:
            Course:
              CourseInstructors:
                User:
                  id:
                    _eq: X-Hasura-User-Id
  - role: org_admin_access
    permission:
      filter:
        Project:
          ProjectCourses:
            Course:
              Program:
                _or:
                  - _and:
                      - type:
                          _eq: EVENTS
                      - Organization:
                          OrganizationAdmins:
                            _and:
                              - userId:
                                  _eq: X-Hasura-User-Id
                              - canManageEvents:
                                  _eq: true
                  - _and:
                      - type:
                          _eq: COURSES
                      - Organization:
                          OrganizationAdmins:
                            _and:
                              - userId:
                                  _eq: X-Hasura-User-Id
                              - canManageCourses:
                                  _eq: true
                  - _and:
                      - type:
                          _eq: DEGREES
                      - Organization:
                          OrganizationAdmins:
                            _and:
                              - userId:
                                  _eq: X-Hasura-User-Id
                              - canManageDegrees:
                                  _eq: true
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageSettings:
                              _eq: true
