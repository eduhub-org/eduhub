table:
  name: LocationAddress
  schema: public
object_relationships:
  - name: LocationOption
    using:
      foreign_key_constraint_on: locationOption
array_relationships:
  - name: CourseLocations
    using:
      foreign_key_constraint_on:
        column: defaultSessionAddressId
        table:
          name: CourseLocation
          schema: public
  - name: SessionAddresses
    using:
      foreign_key_constraint_on:
        column: locationAddressId
        table:
          name: SessionAddress
          schema: public
insert_permissions:
  - role: admin
    permission:
      check: {}
      columns:
        - locationOption
        - shortLabel
        - address
        - description
        - aliases
  - role: instructor_access
    permission:
      check: {}
      columns:
        - locationOption
        - shortLabel
        - address
        - description
        - aliases
  - role: user_access
    permission:
      check: {}
      columns:
        - locationOption
        - shortLabel
        - address
        - description
        - aliases
select_permissions:
  - role: admin
    permission:
      columns:
        - id
        - locationOption
        - shortLabel
        - address
        - description
        - aliases
        - created_at
        - updated_at
      filter: {}
      allow_aggregations: true
  - role: anonymous
    permission:
      columns:
        - id
        - locationOption
        - shortLabel
        - address
        - description
        - aliases
        - created_at
        - updated_at
      filter: {}
      allow_aggregations: true
  - role: instructor_access
    permission:
      columns:
        - id
        - locationOption
        - shortLabel
        - address
        - description
        - aliases
        - created_at
        - updated_at
      filter: {}
      allow_aggregations: true
  - role: user_access
    permission:
      columns:
        - id
        - locationOption
        - shortLabel
        - address
        - description
        - aliases
        - created_at
        - updated_at
      filter: {}
      allow_aggregations: true
update_permissions:
  - role: admin
    permission:
      columns:
        - locationOption
        - shortLabel
        - address
        - description
        - aliases
      filter: {}
      check: {}
  - role: instructor_access
    permission:
      columns:
        - shortLabel
        - address
        - description
        - aliases
      filter: {}
      check: {}
  - role: user_access
    permission:
      columns:
        - shortLabel
        - address
        - description
        - aliases
      filter: {}
      check: {}
delete_permissions:
  - role: admin
    permission:
      filter: {}
  - role: instructor_access
    permission:
      filter: {}
  - role: user_access
    permission:
      filter: {}
