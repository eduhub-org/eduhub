event_triggers:
  # Resyncs the listed events at this location on rausgegangen.de.
  - name: rausgegangen_location_address_changed
    definition:
      enable_manual: false
      update:
        columns:
          - shortLabel
          - description
          - street
          - zipCode
          - city
          - country
          - addressAdditionalInfo
          - directions
          - latitude
          - longitude
          - category
          - image
          - imageCredits
          - websiteUrl
          - publicEmail
          - publicPhone
          - instagramUrl
    retry_conf:
      interval_sec: 300
      num_retries: 5
      timeout_sec: 120
    webhook: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
    headers:
      - name: name
        value: syncRausgegangenEvent
      - name: secret
        value_from_env: HASURA_CLOUD_FUNCTION_SECRET
