table:
  name: LocationAddress
  schema: public
object_relationships:
  - name: LocationOption
    using:
      foreign_key_constraint_on: locationOption
  - name: Category
    using:
      foreign_key_constraint_on: category
array_relationships:
  - name: CourseLocations
    using:
      foreign_key_constraint_on:
        column: defaultSessionAddressId
        table:
          name: CourseLocation
          schema: public
  - name: SessionAddresses
    using:
      foreign_key_constraint_on:
        column: locationAddressId
        table:
          name: SessionAddress
          schema: public
