table:
  name: JobSliderJobType
  schema: public
object_relationships:
  - name: JobSliderOption
    using:
      foreign_key_constraint_on: jobSliderOptionId
  - name: JobPostingType
    using:
      foreign_key_constraint_on: jobType
select_permissions:
  - role: anonymous
    permission:
      columns:
        - id
        - jobSliderOptionId
        - jobType
        - created_at
        - updated_at
      filter: {}
