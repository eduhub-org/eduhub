table:
  name: Attendance
  schema: public
object_relationships:
  - name: AttendanceSource
    using:
      manual_configuration:
        column_mapping:
          source: value
        insertion_order: null
        remote_table:
          name: AttendanceSource
          schema: public
  - name: AttendanceStatus
    using:
      foreign_key_constraint_on: status
  - name: Session
    using:
      foreign_key_constraint_on: sessionId
  - name: User
    using:
      foreign_key_constraint_on: userId
insert_permissions:
  - role: instructor_access
    permission:
      check:
        _or:
          - Session:
              Course:
                CourseInstructors:
                  User:
                    id:
                      _eq: X-Hasura-User-Id
          # Program sessions: only participants of a course the instructor
          # teaches within the program that owns the session.
          - User:
              CourseEnrollments:
                _and:
                  - status:
                      _in:
                        - CONFIRMED
                        - REGISTERED
                        - COMPLETED
                  - Course:
                      _and:
                        - CourseInstructors:
                            User:
                              id:
                                _eq: X-Hasura-User-Id
                        - Program:
                            Sessions:
                              id:
                                _ceq:
                                  - $
                                  - sessionId
      columns:
        - sessionId
        - source
        - status
        - userId
        - location
  - role: org_admin_access
    permission:
      check:
        _or:
          - Session:
              Course:
                Program:
                  _or:
                    - _and:
                        - type:
                            _eq: EVENTS
                        - Organization:
                            OrganizationAdmins:
                              _and:
                                - userId:
                                    _eq: X-Hasura-User-Id
                                - canManageEvents:
                                    _eq: true
                    - _and:
                        - type:
                            _eq: COURSES
                        - Organization:
                            OrganizationAdmins:
                              _and:
                                - userId:
                                    _eq: X-Hasura-User-Id
                                - canManageCourses:
                                    _eq: true
                    - _and:
                        - type:
                            _eq: DEGREES
                        - Organization:
                            OrganizationAdmins:
                              _and:
                                - userId:
                                    _eq: X-Hasura-User-Id
                                - canManageDegrees:
                                    _eq: true
                    - Organization:
                        OrganizationAdmins:
                          _and:
                            - userId:
                                _eq: X-Hasura-User-Id
                            - canManageSettings:
                                _eq: true
          - User:
              CourseEnrollments:
                _and:
                  - status:
                      _in:
                        - CONFIRMED
                        - REGISTERED
                        - COMPLETED
                  - Course:
                      _and:
                        - Program:
                            _or:
                              - _and:
                                  - type:
                                      _eq: EVENTS
                                  - Organization:
                                      OrganizationAdmins:
                                        _and:
                                          - userId:
                                              _eq: X-Hasura-User-Id
                                          - canManageEvents:
                                              _eq: true
                              - _and:
                                  - type:
                                      _eq: COURSES
                                  - Organization:
                                      OrganizationAdmins:
                                        _and:
                                          - userId:
                                              _eq: X-Hasura-User-Id
                                          - canManageCourses:
                                              _eq: true
                              - _and:
                                  - type:
                                      _eq: DEGREES
                                  - Organization:
                                      OrganizationAdmins:
                                        _and:
                                          - userId:
                                              _eq: X-Hasura-User-Id
                                          - canManageDegrees:
                                              _eq: true
                              - Organization:
                                  OrganizationAdmins:
                                    _and:
                                      - userId:
                                          _eq: X-Hasura-User-Id
                                      - canManageSettings:
                                          _eq: true
                        - Program:
                            Sessions:
                              id:
                                _ceq:
                                  - $
                                  - sessionId
      columns:
        - sessionId
        - source
        - status
        - userId
        - location
