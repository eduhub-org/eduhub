table:
  name: Attendance
  schema: public
object_relationships:
  - name: AttendanceSource
    using:
      manual_configuration:
        column_mapping:
          source: value
        insertion_order: null
        remote_table:
          name: AttendanceSource
          schema: public
  - name: AttendanceStatus
    using:
      foreign_key_constraint_on: status
  - name: Session
    using:
      foreign_key_constraint_on: sessionId
  - name: User
    using:
      foreign_key_constraint_on: userId
insert_permissions:
  - role: instructor_access
    permission:
      check:
        Session:
          Course:
            CourseInstructors:
              User:
                id:
                  _eq: X-Hasura-User-Id
      columns:
        - sessionId
        - source
        - status
        - userId
        - location
select_permissions:
  - role: api_proxy
    permission:
      columns:
        - id
        - status
        - sessionId
        - userId
        - totalAttendanceTime
        - startDateTime
        - endDateTime
      filter: {}
  - role: instructor_access
    permission:
      columns:
        - id
        - created_at
        - updated_at
        - totalAttendanceTime
        - status
        - interruptionCount
        - endDateTime
        - startDateTime
        - sessionId
        - userId
        - recordedIdentifier
        - matchType
        - source
        - location
      filter:
        Session:
          Course:
            CourseInstructors:
              User:
                id:
                  _eq: X-Hasura-User-Id
  - role: user_access
    permission:
      columns:
        - id
        - created_at
        - updated_at
        - totalAttendanceTime
        - status
        - interruptionCount
        - endDateTime
        - startDateTime
        - sessionId
        - userId
        - recordedIdentifier
        - matchType
        - source
        - location
      filter:
        User:
          id:
            _eq: X-Hasura-User-Id
update_permissions:
  - role: instructor_access
    permission:
      columns:
        - endDateTime
        - interruptionCount
        - recordedIdentifier
        - matchType
        - source
        - startDateTime
        - status
        - totalAttendanceTime
        - location
      filter:
        Session:
          Course:
            CourseInstructors:
              User:
                id:
                  _eq: X-Hasura-User-Id
      check: {}
