table:
  name: ProjectType
  schema: public
array_relationships:
  - name: ProjectDocumentationInstructions
    using:
      foreign_key_constraint_on:
        column: projectTypeValue
        table:
          name: ProjectDocumentationInstruction
          schema: public
  - name: Projects
    using:
      foreign_key_constraint_on:
        column: type
        table:
          name: Project
          schema: public
select_permissions:
  - role: anonymous
    permission:
      columns:
        - value
        - comment
        - requiresDocumentation
        - requiresPresentation
        - requiresExternalUrl
        - requiresCoverImage
      filter: {}
  - role: user_access
    permission:
      columns:
        - value
        - comment
        - requiresDocumentation
        - requiresPresentation
        - requiresExternalUrl
        - requiresCoverImage
      filter: {}
  - role: instructor_access
    permission:
      columns:
        - value
        - comment
        - requiresDocumentation
        - requiresPresentation
        - requiresExternalUrl
        - requiresCoverImage
      filter: {}
