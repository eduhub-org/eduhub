table:
  name: SessionAddress
  schema: public
object_relationships:
  - name: CourseLocation
    using:
      foreign_key_constraint_on: courseLocationId
  - name: LocationAddress
    using:
      foreign_key_constraint_on: locationAddressId
  - name: Session
    using:
      foreign_key_constraint_on: sessionId
insert_permissions:
  - role: instructor_access
    permission:
      check:
        Session:
          Course:
            CourseInstructors:
              User:
                id:
                  _eq: X-Hasura-User-Id
      columns:
        - address
        - courseLocationId
        - id
        - sessionId
        - locationAddressId
  - role: org_admin_access
    permission:
      check:
        Session:
          Program:
            _or:
              - _and:
                  - type:
                      _eq: EVENTS
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageEvents:
                              _eq: true
              - _and:
                  - type:
                      _eq: COURSES
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageCourses:
                              _eq: true
              - _and:
                  - type:
                      _eq: DEGREES
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageDegrees:
                              _eq: true
              # A settings admin manages every program type for their organization (no type constraint).
              - Organization:
                  OrganizationAdmins:
                    _and:
                      - userId:
                          _eq: X-Hasura-User-Id
                      - canManageSettings:
                          _eq: true
      columns:
        - address
        - locationAddressId
        - locationOption
        - sessionId
select_permissions:
  - role: anonymous
    permission:
      columns:
        - address
        - courseLocationId
        - created_at
        - id
        - sessionId
        - locationAddressId
        - locationOption
        - updated_at
      filter: {}
  - role: org_admin_access
    permission:
      columns:
        - address
        - courseLocationId
        - created_at
        - id
        - locationAddressId
        - locationOption
        - sessionId
        - updated_at
      filter:
        Session:
          Program:
            Organization:
              OrganizationAdmins:
                userId:
                  _eq: X-Hasura-User-Id
