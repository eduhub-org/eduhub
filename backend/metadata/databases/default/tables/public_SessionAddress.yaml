                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageEvents:
                              _eq: true
              - _and:
                  - type:
                      _eq: COURSES
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageCourses:
