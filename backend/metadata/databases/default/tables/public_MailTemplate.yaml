table:
  name: MailTemplate
  schema: public
object_relationships:
  - name: Course
    using:
      foreign_key_constraint_on: courseId
  - name: MailTemplateType
    using:
      foreign_key_constraint_on: type
insert_permissions:
  # Org admins may create course-specific templates for courses whose program they manage (per-type
  # capability or canManageSettings). System-default templates (courseId null) stay super-admin-only:
  # every branch below requires a Course -> Program, so a null-courseId row can never pass the check.
  - role: org_admin_access
    permission:
      check:
        _or:
          - Course:
              Program:
                _and:
                  - type:
                      _eq: EVENTS
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageEvents:
                              _eq: true
          - Course:
              Program:
                _and:
                  - type:
                      _eq: COURSES
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageCourses:
                              _eq: true
          - Course:
              Program:
                _and:
                  - type:
                      _eq: DEGREES
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageDegrees:
                              _eq: true
          - Course:
              Program:
                Organization:
                  OrganizationAdmins:
                    _and:
                      - userId:
                          _eq: X-Hasura-User-Id
                      - canManageSettings:
                          _eq: true
      columns:
        - type
        - courseId
        - subject
        - content
        - from
        - cc
        - bcc
select_permissions:
  - role: instructor_access
    permission:
      columns:
        - id
        - type
        - courseId
        - subject
        - content
        - from
        - cc
        - bcc
        - created_at
        - updated_at
      filter:
        _or:
          - courseId:
              _is_null: true
          - Course:
              CourseInstructors:
                userId:
                  _eq: X-Hasura-User-Id
  # Org admins read system default templates (courseId null) and course-specific templates for
  # courses they may manage (same program-type capability rules as Course org_admin_access writes).
  - role: org_admin_access
    permission:
      columns:
        - id
        - type
        - courseId
        - subject
        - content
        - from
        - cc
        - bcc
        - created_at
        - updated_at
      filter:
        _or:
          - courseId:
              _is_null: true
          - Course:
              Program:
                _and:
                  - type:
                      _eq: EVENTS
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageEvents:
                              _eq: true
          - Course:
              Program:
                _and:
                  - type:
                      _eq: COURSES
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageCourses:
                              _eq: true
          - Course:
              Program:
                _and:
                  - type:
                      _eq: DEGREES
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageDegrees:
                              _eq: true
      allow_aggregations: true
