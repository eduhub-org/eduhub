                  - type:
                      _eq: COURSES
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageCourses:
                              _eq: true
          - Course:
              Program:
                _and:
                  - type:
                      _eq: DEGREES
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageDegrees:
                              _eq: true
          - Course:
              Program:
                Organization:
                  OrganizationAdmins:
                    _and:
                      - userId:
                          _eq: X-Hasura-User-Id
                      - canManageSettings:
                          _eq: true
      check:
        _or:
          - Course:
              Program:
                _and:
                  - type:
                      _eq: EVENTS
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageEvents:
                              _eq: true
          - Course:
              Program:
                _and:
                  - type:
                      _eq: COURSES
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageCourses:
                              _eq: true
          - Course:
              Program:
                _and:
                  - type:
                      _eq: DEGREES
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageDegrees:
                              _eq: true
          - Course:
              Program:
                Organization:
                  OrganizationAdmins:
                    _and:
                      - userId:
                          _eq: X-Hasura-User-Id
                      - canManageSettings:
                          _eq: true
