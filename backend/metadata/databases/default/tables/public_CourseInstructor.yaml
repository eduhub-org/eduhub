table:
  name: CourseInstructor
  schema: public
object_relationships:
  - name: Course
    using:
      foreign_key_constraint_on: courseId
  - name: User
    using:
      foreign_key_constraint_on: userId
select_permissions:
  - role: anonymous
    permission:
      columns:
        - id
        - courseId
        - userId
        - created_at
        - updated_at
      filter: {}
      limit: 10
  - role: instructor_access
    permission:
      columns:
        - id
        - courseId
        - userId
        - created_at
        - updated_at
      filter: {}
  # Org admins see the instructors of every course they can manage (same scope as the instructor
  # contact details they can read in public_User.yaml), e.g. for the "email all instructors" button
  # on the manage programs page. Without this rule they only inherit anonymous's limit of 10 rows;
  # inherited roles take the highest limit of their parent roles, hence an explicit limit here.
  - role: org_admin_access
    permission:
      columns:
        - id
        - courseId
        - userId
        - created_at
        - updated_at
      filter:
        Course:
          Program:
            _or:
              - _and:
                  - type:
                      _eq: EVENTS
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageEvents:
                              _eq: true
              - _and:
                  - type:
                      _eq: COURSES
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageCourses:
                              _eq: true
              - _and:
                  - type:
                      _eq: DEGREES
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageDegrees:
                              _eq: true
              - Organization:
                  OrganizationAdmins:
                    _and:
                      - userId:
                          _eq: X-Hasura-User-Id
                      - canManageSettings:
                          _eq: true
      limit: 1000
insert_permissions:
  - role: instructor_access
    permission:
      check:
        Course:
          CourseInstructors:
            User:
              id:
                _eq: X-Hasura-User-Id
      columns:
        - courseId
        - userId
delete_permissions:
  - role: instructor_access
    permission:
      filter:
        Course:
          CourseInstructors:
            User:
              id:
                _eq: X-Hasura-User-Id
event_triggers:
  - name: add_keycloak_instructor_role
    definition:
      enable_manual: false
      insert:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 0
      timeout_sec: 60
    webhook_from_env: CLOUD_FUNCTION_LINK_ADD_KEYCLOAK_ROLE
    headers:
      - name: secret
        value_from_env: HASURA_CLOUD_FUNCTION_SECRET
      - name: role
        value: instructor
    cleanup_config:
      batch_size: 10000
      clean_invocation_logs: false
      clear_older_than: 168
      paused: true
      schedule: 0 0 * * *
      timeout: 60
  - name: send_organizer_added_email
    definition:
      enable_manual: false
      insert:
        columns: '*'
    retry_conf:
      interval_sec: 3660
      num_retries: 10
      timeout_sec: 60
    webhook_from_env: CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION
    headers:
      - name: secret
        value_from_env: HASURA_CLOUD_FUNCTION_SECRET
      - name: name
        value: sendOrganizerAddedEmail
    cleanup_config:
      batch_size: 10000
      clean_invocation_logs: false
      clear_older_than: 168
      paused: true
      schedule: 0 0 * * *
      timeout: 60
  - name: update_matrix_instructor_power_level
    definition:
      enable_manual: false
      insert:
        columns: '*'
      delete:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook_from_env: CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION
    headers:
      - name: secret
        value_from_env: HASURA_CLOUD_FUNCTION_SECRET
      - name: name
        value: updateMatrixInstructorPowerLevel
    cleanup_config:
      batch_size: 10000
      clean_invocation_logs: false
      clear_older_than: 168
      paused: true
      schedule: 0 0 * * *
      timeout: 60
