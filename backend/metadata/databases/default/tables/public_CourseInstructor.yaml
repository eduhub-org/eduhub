table:
  name: CourseInstructor
  schema: public
object_relationships:
  - name: Course
    using:
      foreign_key_constraint_on: courseId
  - name: User
    using:
      foreign_key_constraint_on: userId
select_permissions:
  - role: anonymous
    permission:
      columns:
        - id
        - courseId
        - userId
        - created_at
        - updated_at
      filter: {}
      limit: 10
  - role: instructor_access
    permission:
      columns:
        - id
        - courseId
        - userId
        - created_at
        - updated_at
      filter: {}
insert_permissions:
  - role: instructor_access
    permission:
      check:
        Course:
          CourseInstructors:
            User:
              id:
                _eq: X-Hasura-User-Id
      columns:
        - courseId
        - userId
delete_permissions:
  - role: instructor_access
    permission:
      filter:
        Course:
          CourseInstructors:
            User:
              id:
                _eq: X-Hasura-User-Id
event_triggers:
  - name: add_keycloak_instructor_role
    definition:
      enable_manual: false
      insert:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 0
      timeout_sec: 60
    webhook_from_env: CLOUD_FUNCTION_LINK_KEYCLOAK_ADMIN
    headers:
      - name: secret
        value_from_env: HASURA_CLOUD_FUNCTION_SECRET
      - name: name
        value: addKeycloakRole
      - name: role
        value: instructor
    cleanup_config:
      batch_size: 10000
      clean_invocation_logs: false
      clear_older_than: 168
      paused: true
      schedule: 0 0 * * *
      timeout: 60
  - name: send_organizer_added_email
    definition:
      enable_manual: false
      insert:
        columns: '*'
    retry_conf:
      interval_sec: 3660
      num_retries: 10
      timeout_sec: 60
    webhook_from_env: CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION
    headers:
      - name: secret
        value_from_env: HASURA_CLOUD_FUNCTION_SECRET
      - name: name
        value: sendOrganizerAddedEmail
    cleanup_config:
      batch_size: 10000
      clean_invocation_logs: false
      clear_older_than: 168
      paused: true
      schedule: 0 0 * * *
      timeout: 60
  - name: update_matrix_instructor_power_level
    definition:
      enable_manual: false
      insert:
        columns: '*'
      delete:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook_from_env: CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION
    headers:
      - name: secret
        value_from_env: HASURA_CLOUD_FUNCTION_SECRET
      - name: name
        value: updateMatrixInstructorPowerLevel
    cleanup_config:
      batch_size: 10000
      clean_invocation_logs: false
      clear_older_than: 168
      paused: true
      schedule: 0 0 * * *
      timeout: 60
