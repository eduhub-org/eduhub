table:
  name: CourseLocation
  schema: public
object_relationships:
  - name: Course
    using:
      foreign_key_constraint_on: courseId
  - name: DefaultSessionAddress
    using:
      foreign_key_constraint_on: defaultSessionAddressId
  - name: LocationOption
    using:
      manual_configuration:
        column_mapping:
          locationOption: value
        insertion_order: null
        remote_table:
          name: LocationOption
          schema: public
insert_permissions:
  - role: instructor_access
    permission:
      check:
        _and:
          - Course:
              CourseInstructors:
                User:
                  id:
                    _eq: X-Hasura-User-Id
          - _or:
              - defaultSessionAddressId:
                  _is_null: true
              - DefaultSessionAddress:
                  locationOption:
                    _ceq:
                      - $
                      - locationOption
      columns:
        - courseId
        - defaultSessionAddress
        - defaultSessionAddressId
        - id
        - locationOption
select_permissions:
  - role: api_proxy
    permission:
      columns:
        - courseId
        - defaultSessionAddressId
        - id
        - locationOption
      filter: {}
  - role: anonymous
    permission:
      columns:
        - courseId
        - defaultSessionAddress
        - defaultSessionAddressId
        - id
        - locationOption
      filter: {}
      limit: 10
  - role: user_access
    permission:
      columns:
        - courseId
        - created_at
        - defaultSessionAddress
        - defaultSessionAddressId
        - id
        - locationOption
        - updated_at
      filter: {}
      limit: 10
update_permissions:
  - role: instructor_access
    permission:
      columns:
        - courseId
        - defaultSessionAddress
        - defaultSessionAddressId
        - locationOption
      filter:
        Course:
          CourseInstructors:
            User:
              id:
                _eq: X-Hasura-User-Id
      check:
        _or:
          - defaultSessionAddressId:
              _is_null: true
          - DefaultSessionAddress:
              locationOption:
                _ceq:
                  - $
                  - locationOption
delete_permissions:
  - role: instructor_access
    permission:
      filter:
        Course:
          CourseInstructors:
            User:
              id:
                _eq: X-Hasura-User-Id
