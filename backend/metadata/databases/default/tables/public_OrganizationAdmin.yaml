table:
  name: OrganizationAdmin
  schema: public
object_relationships:
  - name: Organization
    using:
      foreign_key_constraint_on: organizationId
  - name: User
    using:
      foreign_key_constraint_on: userId
  - name: ClaimVerification
    using:
      foreign_key_constraint_on: claimVerification
select_permissions:
  # Org admins may read (a) their own grant — so the UI can derive their capabilities even when they
  # have no settings rights — and (b) every admin grant of any organization for which they hold the
  # canManageSettings capability, so they can manage that organization's admin team.
  #
  # claimVerification and authorizationDeclaredAt are readable here so the access screen can show
  # how a grant came about, but they appear in NO insert or update permission: they are written by
  # the claimJobOrganization action only. A settings admin who could set them on any grant in their
  # organization would make them worthless as review signals.
  - role: org_admin_access
    permission:
      columns:
        - id
        - userId
        - organizationId
        - canManageCourses
        - canManageEvents
        - canManageDegrees
        - canManageJobs
        - canManageSettings
        - claimVerification
        - authorizationDeclaredAt
        - created_at
        - updated_at
      filter:
        _or:
          - userId:
              _eq: X-Hasura-User-Id
          - Organization:
              OrganizationAdmins:
                _and:
                  - userId:
                      _eq: X-Hasura-User-Id
                  - canManageSettings:
                      _eq: true
      allow_aggregations: true
insert_permissions:
  # An org admin with canManageSettings may add admins to organizations they manage. The check pins
  # the new row's organization to one they hold canManageSettings on; id is serial and userId/flags
  # are supplied by the caller. They cannot grant super-admin (that lives in the separate Admin table).
  - role: org_admin_access
    permission:
      columns:
        - userId
        - organizationId
        - canManageCourses
        - canManageEvents
        - canManageDegrees
        - canManageJobs
        - canManageSettings
      check:
        Organization:
          OrganizationAdmins:
            _and:
              - userId:
                  _eq: X-Hasura-User-Id
              - canManageSettings:
                  _eq: true
update_permissions:
  # An org admin with canManageSettings may change the capability flags of grants in organizations
  # they manage. organizationId and userId are intentionally not updatable, so a grant cannot be
  # moved to another organization or reassigned to a different user, keeping changes inside scope.
  - role: org_admin_access
    permission:
      columns:
        - canManageCourses
        - canManageEvents
        - canManageDegrees
        - canManageJobs
        - canManageSettings
      filter:
        Organization:
          OrganizationAdmins:
            _and:
              - userId:
                  _eq: X-Hasura-User-Id
              - canManageSettings:
                  _eq: true
      check:
        Organization:
          OrganizationAdmins:
            _and:
              - userId:
                  _eq: X-Hasura-User-Id
              - canManageSettings:
                  _eq: true
delete_permissions:
  # An org admin with canManageSettings may remove admins from organizations they manage.
  - role: org_admin_access
    permission:
      filter:
        Organization:
          OrganizationAdmins:
            _and:
              - userId:
                  _eq: X-Hasura-User-Id
              - canManageSettings:
                  _eq: true
event_triggers:
  - name: add_keycloak_org_admin_role
    definition:
      enable_manual: false
      insert:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook_from_env: CLOUD_FUNCTION_LINK_ADD_KEYCLOAK_ROLE
    headers:
      - name: secret
        value_from_env: HASURA_CLOUD_FUNCTION_SECRET
      - name: role
        value: org_admin
    cleanup_config:
      batch_size: 10000
      clean_invocation_logs: false
      clear_older_than: 168
      paused: true
      schedule: 0 0 * * *
      timeout: 60
  # On delete, ask removeKeycloakRole to revoke the org_admin Keycloak role. The function is a no-op
  # if the user still administers another organization (still has an OrganizationAdmin row), so the
  # role is only actually removed when the last grant is gone.
  - name: remove_keycloak_org_admin_role
    definition:
      enable_manual: false
      delete:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook_from_env: CLOUD_FUNCTION_LINK_REMOVE_KEYCLOAK_ROLE
    headers:
      - name: secret
        value_from_env: HASURA_CLOUD_FUNCTION_SECRET
      - name: role
        value: org_admin
    cleanup_config:
      batch_size: 10000
      clean_invocation_logs: false
      clear_older_than: 168
      paused: true
      schedule: 0 0 * * *
      timeout: 60
