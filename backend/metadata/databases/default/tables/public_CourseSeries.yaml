table:
  name: CourseSeries
  schema: public
object_relationships:
  - name: Organization
    using:
      foreign_key_constraint_on: organizationId
array_relationships:
  - name: Courses
    using:
      foreign_key_constraint_on:
        column: courseSeriesId
        table:
          name: Course
          schema: public
select_permissions:
  - role: anonymous
    permission:
      columns:
        - id
        - title
        - organizationId
        - created_at
        - updated_at
      # Only series that have at least one publicly-visible course, mirroring the
      # Course anonymous visibility gate.
      filter:
        Courses:
          _and:
            - published:
                _eq: true
            - Program:
                published:
                  _eq: true
  - role: org_admin_access
    permission:
      columns:
        - id
        - title
        - organizationId
        - created_at
        - updated_at
      filter:
        Organization:
          OrganizationAdmins:
            userId:
              _eq: X-Hasura-User-Id
insert_permissions:
  - role: org_admin_access
    permission:
      check:
        Organization:
          OrganizationAdmins:
            userId:
              _eq: X-Hasura-User-Id
      columns:
        - title
        - organizationId
