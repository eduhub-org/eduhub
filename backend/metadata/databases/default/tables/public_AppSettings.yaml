table:
  name: AppSettings
  schema: public
object_relationships:
  - name: DefaultAttendanceCertificateTemplate
    using:
      foreign_key_constraint_on: defaultAttendanceCertificateTemplateId
select_permissions:
  - role: anonymous
    permission:
      columns:
        - appName
        - backgroundImageURL
        - bannerBackgroundColor
        - bannerFontColor
        - bannerTextDe
        - bannerTextEn
        - created_at
        - defaultAttendanceCertificateTemplateId
        - faqCollectionName
        - previewImageURL
        - showFaqSection
        - timeZone
        - updated_at
      filter: {}
