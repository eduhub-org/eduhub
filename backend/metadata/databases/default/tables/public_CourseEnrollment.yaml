table:
  name: CourseEnrollment
  schema: public
object_relationships:
  - name: BillingOrganization
    using:
      foreign_key_constraint_on: billingOrganizationId
  - name: Course
    using:
      foreign_key_constraint_on: courseId
  - name: CourseEnrollmentStatus
    using:
      foreign_key_constraint_on: status
  - name: LocationOption
    using:
      foreign_key_constraint_on: location
  - name: MotivationRating
    using:
      foreign_key_constraint_on: motivationRating
  - name: User
    using:
      foreign_key_constraint_on: userId
  - name: DegreeParticipationStats
    using:
      manual_configuration:
        column_mapping:
          courseId: degreeCourseId
          userId: userId
        insertion_order: null
        remote_table:
          name: DegreeParticipationStats
          schema: public
array_relationships:
  - name: CourseEnrollmentAddons
    using:
      foreign_key_constraint_on:
        column: enrollmentId
        table:
          name: CourseEnrollmentAddon
          schema: public
  - name: Invoices
    using:
      foreign_key_constraint_on:
        column: courseEnrollmentId
        table:
          name: Invoice
          schema: public
insert_permissions:
  - role: user_access
    permission:
      check: {}
      columns:
        - billingOrganizationId
        - courseId
        - motivationLetter
        - status
        - userId
        - location
        - termsAcceptedAt
  # Org admins may enroll users into courses whose program they manage (per-type capability or
  # canManageSettings). The check resolves the target course's program/organization.
  - role: org_admin_access
    permission:
      check:
        _or:
          - Course:
              Program:
                _and:
                  - type:
                      _eq: EVENTS
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageEvents:
                              _eq: true
          - Course:
              Program:
                _and:
                  - type:
                      _eq: COURSES
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageCourses:
                              _eq: true
          - Course:
              Program:
                _and:
                  - type:
                      _eq: DEGREES
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageDegrees:
                              _eq: true
          - Course:
              Program:
                Organization:
                  OrganizationAdmins:
                    _and:
                      - userId:
                          _eq: X-Hasura-User-Id
                      - canManageSettings:
                          _eq: true
      columns:
        - courseId
        - userId
        - status
        - billingOrganizationId
        - motivationLetter
        - location
        - termsAcceptedAt
select_permissions:
  - role: instructor_access
    permission:
      columns:
        - id
        - courseId
        - userId
        - status
        - motivationLetter
        - motivationRating
        - achievementCertificateURL
        - attendanceCertificateURL
        - created_at
        - updated_at
        - billingOrganizationId
        - invitationExpirationDate
        - location
        - termsAcceptedAt
      filter: {}
      allow_aggregations: true
  - role: user_access
    permission:
      columns:
        - achievementCertificateURL
        - attendanceCertificateURL
        - courseId
        - created_at
        - id
        - billingOrganizationId
        - invitationExpirationDate
        - motivationLetter
        - status
        - updated_at
        - userId
        - location
        - termsAcceptedAt
      filter:
        _and:
          - userId:
              _eq: X-Hasura-User-Id
          - Course:
              CourseEnrollments:
                userId:
                  _eq: X-Hasura-User-Id
  - role: user_access_others
    permission:
      columns:
        - courseId
        - id
        - userId
        - location
      filter: {}
  # Org admins may read enrollments for courses whose program belongs to an organization they
  # administer, gated by the capability matching that program type or by canManageSettings. The
  # column set mirrors instructor_access so the management UI can display/edit the same fields.
  - role: org_admin_access
    permission:
      columns:
        - id
        - courseId
        - userId
        - status
        - motivationLetter
        - motivationRating
        - achievementCertificateURL
        - attendanceCertificateURL
        - created_at
        - updated_at
        - billingOrganizationId
        - invitationExpirationDate
        - location
        - termsAcceptedAt
      filter:
        _or:
          - Course:
              Program:
                _and:
                  - type:
                      _eq: EVENTS
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageEvents:
                              _eq: true
          - Course:
              Program:
                _and:
                  - type:
                      _eq: COURSES
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageCourses:
                              _eq: true
          - Course:
              Program:
                _and:
                  - type:
                      _eq: DEGREES
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageDegrees:
                              _eq: true
          - Course:
              Program:
                Organization:
                  OrganizationAdmins:
                    _and:
                      - userId:
                          _eq: X-Hasura-User-Id
                      - canManageSettings:
                          _eq: true
      allow_aggregations: true
update_permissions:
  - role: instructor_access
    permission:
      columns:
        - billingOrganizationId
        - invitationExpirationDate
        - motivationRating
        - status
        - location
        - termsAcceptedAt
      filter:
        _or:
          - Course:
              CourseInstructors:
                userId:
                  _eq: X-Hasura-User-Id
          - userId:
              _eq: X-Hasura-User-Id
      check: {}
  - role: user_access
    permission:
      columns:
        - billingOrganizationId
        - invitationExpirationDate
        - motivationRating
        - status
        - location
        - termsAcceptedAt
      filter:
        userId:
          _eq: X-Hasura-User-Id
      check: {}
  - role: instructor
    permission:
      columns:
        - billingOrganizationId
        - invitationExpirationDate
        - motivationRating
        - status
        - location
        - termsAcceptedAt
      filter:
        _or:
          - Course:
              CourseInstructors:
                userId:
                  _eq: X-Hasura-User-Id
          - userId:
              _eq: X-Hasura-User-Id
      check: {}
  # Org admins may update enrollments for courses whose program they manage. There is no delete
  # permission by design: "removing" an enrollment is a status change (e.g. to CANCELLED), which
  # avoids the destructive ProjectEnrollment / CourseEnrollmentAddon cascades.
  - role: org_admin_access
    permission:
      columns:
        - status
        - motivationRating
        - billingOrganizationId
        - invitationExpirationDate
        - location
        - termsAcceptedAt
      filter:
        _or:
          - Course:
              Program:
                _and:
                  - type:
                      _eq: EVENTS
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageEvents:
                              _eq: true
          - Course:
              Program:
                _and:
                  - type:
                      _eq: COURSES
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageCourses:
                              _eq: true
          - Course:
              Program:
                _and:
                  - type:
                      _eq: DEGREES
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageDegrees:
                              _eq: true
          - Course:
              Program:
                Organization:
                  OrganizationAdmins:
                    _and:
                      - userId:
                          _eq: X-Hasura-User-Id
                      - canManageSettings:
                          _eq: true
      check:
        _or:
          - Course:
              Program:
                _and:
                  - type:
                      _eq: EVENTS
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageEvents:
                              _eq: true
          - Course:
              Program:
                _and:
                  - type:
                      _eq: COURSES
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageCourses:
                              _eq: true
          - Course:
              Program:
                _and:
                  - type:
                      _eq: DEGREES
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageDegrees:
                              _eq: true
          - Course:
              Program:
                Organization:
                  OrganizationAdmins:
                    _and:
                      - userId:
                          _eq: X-Hasura-User-Id
                      - canManageSettings:
                          _eq: true
event_triggers:
  - name: add_confirmed_user_to_mm
    definition:
      enable_manual: true
      insert:
        columns: '*'
      update:
        columns:
          - status
    retry_conf:
      interval_sec: 10
      num_retries: 0
      timeout_sec: 60
    webhook: '{{CLOUD_FUNCTION_LINK_CALL_PYTHON_FUNCTION}}'
    headers:
      - name: Function-Name
        value: add_confirmed_user_to_mm
      - name: Hasura-Secret
        value_from_env: HASURA_CLOUD_FUNCTION_SECRET
  - name: send_enrollment_status_email
    definition:
      enable_manual: true
      insert:
        columns: '*'
      update:
        columns:
          - invitationExpirationDate
          - status
          - achievementCertificateURL
          - attendanceCertificateURL
    retry_conf:
      interval_sec: 3660
      num_retries: 10
      timeout_sec: 600
    webhook: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
    headers:
      - name: name
        value: sendEnrollmentEmail
      - name: secret
        value_from_env: HASURA_CLOUD_FUNCTION_SECRET
