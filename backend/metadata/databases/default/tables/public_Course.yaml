table:
  name: Course
  schema: public
object_relationships:
  - name: AchievementCertificateTemplate
    using:
      foreign_key_constraint_on: achievementCertificateTemplateId
  - name: AttendanceCertificateTemplate
    using:
      foreign_key_constraint_on: attendanceCertificateTemplateId
  - name: CourseRegistrationType
    using:
      foreign_key_constraint_on: registrationType
  - name: CourseSeries
    using:
      foreign_key_constraint_on: courseSeriesId
  - name: CourseStatus
    using:
      foreign_key_constraint_on: status
  - name: Language
    using:
      foreign_key_constraint_on: language
  - name: Program
    using:
      foreign_key_constraint_on: programId
  - name: Weekday
    using:
      foreign_key_constraint_on: weekDay
array_relationships:
  - name: AchievementOptionCourses
    using:
      foreign_key_constraint_on:
        column: courseId
        table:
          name: AchievementOptionCourse
          schema: public
  - name: CourseDegrees
    using:
      foreign_key_constraint_on:
        column: courseId
        table:
          name: CourseDegree
          schema: public
  - name: CourseEnrollments
    using:
      foreign_key_constraint_on:
        column: courseId
        table:
          name: CourseEnrollment
          schema: public
  - name: CourseFundingOrganizations
    using:
      foreign_key_constraint_on:
        column: courseId
        table:
          name: CourseFundingOrganization
          schema: public
  - name: CourseGroups
    using:
      foreign_key_constraint_on:
        column: courseId
        table:
          name: CourseGroup
          schema: public
  - name: CourseInstructors
    using:
      foreign_key_constraint_on:
        column: courseId
        table:
          name: CourseInstructor
          schema: public
  - name: CourseLocations
    using:
      foreign_key_constraint_on:
        column: courseId
        table:
          name: CourseLocation
          schema: public
  - name: DegreeCourses
    using:
      foreign_key_constraint_on:
        column: degreeCourseId
        table:
          name: CourseDegree
          schema: public
  - name: ProjectCourses
    using:
      foreign_key_constraint_on:
        column: courseId
        table:
          name: ProjectCourse
          schema: public
  - name: Sessions
    using:
      foreign_key_constraint_on:
        column: courseId
        table:
          name: Session
          schema: public
  - name: CourseAddonMappings
    using:
      foreign_key_constraint_on:
        column: courseId
        table:
          name: CourseAddonMapping
          schema: public
computed_fields:
  - name: activeParticipantCount
    definition:
      function:
        name: course_active_participant_count
        schema: public
      table_argument: course_row
select_permissions:
  - role: anonymous
    permission:
      columns:
        - achievementCertificatePossible
        - achievementCertificateTemplateId
        - attendanceCertificateTemplateId
        - applicationEnd
        - attendanceCertificatePossible
        - chatLink
        - contentDescriptionField1
        - contentDescriptionField2
        - cost
        - coverImage
        - created_at
        - ects
        - requiredEcts
        - requiredEventCount
        - endTime
        - externalRegistrationLink
        - headingDescriptionField1
        - headingDescriptionField2
        - id
        - language
        - learningGoals
        - maxMissedSessions
        - maxParticipants
        - programId
        - projectProposalsEnabled
        - projectSubmissionDeadline
        - published
        - registrationType
        - startTime
        - tagline
        - title
        - updated_at
        - weekDay
        - formbricksEnrollmentSurveyUrl
        - basePrice
        - currency
        - stripeProductId
        - stripePriceId
        - courseSeriesId
      computed_fields:
        - activeParticipantCount
      filter:
        _and:
          - Program:
              published:
                _eq: true
          - published:
              _eq: true
  - role: instructor_access
    permission:
      columns:
        - achievementCertificatePossible
        - achievementCertificateTemplateId
        - attendanceCertificateTemplateId
        - applicationEnd
        - attendanceCertificatePossible
        - chatLink
        - contentDescriptionField1
        - contentDescriptionField2
        - cost
        - coverImage
        - created_at
        - ects
        - requiredEcts
        - requiredEventCount
        - endTime
        - externalRegistrationLink
        - headingDescriptionField1
        - headingDescriptionField2
        - id
        - language
        - learningGoals
        - maxMissedSessions
        - maxParticipants
        - programId
        - projectProposalsEnabled
        - projectSubmissionDeadline
        - published
        - startTime
        - status
        - tagline
        - title
        - updated_at
        - weekDay
        - formbricksEnrollmentSurveyUrl
        - basePrice
        - currency
        - stripeProductId
        - stripePriceId
        - matrixRoomId
      computed_fields:
        - activeParticipantCount
      filter: {}
  - role: user_access
    permission:
      columns:
        - achievementCertificatePossible
        - achievementCertificateTemplateId
        - attendanceCertificateTemplateId
        - applicationEnd
        - attendanceCertificatePossible
        - chatLink
        - contentDescriptionField1
        - contentDescriptionField2
        - cost
        - coverImage
        - created_at
        - ects
        - requiredEcts
        - requiredEventCount
        - endTime
        - headingDescriptionField1
        - headingDescriptionField2
        - id
        - language
        - learningGoals
        - maxMissedSessions
        - maxParticipants
        - programId
        - projectProposalsEnabled
        - projectSubmissionDeadline
        - published
        - startTime
        - status
        - tagline
        - title
        - updated_at
        - weekDay
        - formbricksEnrollmentSurveyUrl
        - basePrice
        - currency
        - stripeProductId
        - stripePriceId
        - matrixRoomId
      computed_fields:
        - activeParticipantCount
      filter:
        CourseEnrollments:
          User:
            id:
              _eq: X-Hasura-User-Id
  # Org admins see every course belonging to a program of any organization they administer.
  # Create/edit/delete is gated below by the program's type capability.
  - role: org_admin_access
    permission:
      columns:
        - achievementCertificatePossible
        - achievementCertificateTemplateId
        - attendanceCertificateTemplateId
        - applicationEnd
        - attendanceCertificatePossible
        - chatLink
        - contentDescriptionField1
        - contentDescriptionField2
        - cost
        - coverImage
        - created_at
        - ects
        - requiredEcts
        - requiredEventCount
        - endTime
        - externalRegistrationLink
        - headingDescriptionField1
        - headingDescriptionField2
        - id
        - language
        - learningGoals
        - maxMissedSessions
        - maxParticipants
        - programId
        - projectProposalsEnabled
        - projectSubmissionDeadline
        - published
        - startTime
        - status
        - tagline
        - title
        - updated_at
        - weekDay
        - formbricksEnrollmentSurveyUrl
        - basePrice
        - currency
        - stripeProductId
        - stripePriceId
        - matrixRoomId
      computed_fields:
        - activeParticipantCount
      filter:
        Program:
          Organization:
            OrganizationAdmins:
              userId:
                _eq: X-Hasura-User-Id
      # The manage-courses list reads Course_aggregate { count }, so org admins need aggregations.
      allow_aggregations: true
update_permissions:
  - role: instructor_access
    permission:
      columns:
        - achievementCertificateTemplateId
        - attendanceCertificateTemplateId
        - chatLink
        - contentDescriptionField1
        - contentDescriptionField2
        - coverImage
        - ects
        - requiredEcts
        - requiredEventCount
        - endTime
        - headingDescriptionField1
        - headingDescriptionField2
        - language
        - learningGoals
        - maxMissedSessions
        - maxParticipants
        - projectProposalsEnabled
        - projectSubmissionDeadline
        - startTime
        - status
        - tagline
        - title
        - weekDay
        - formbricksEnrollmentSurveyUrl
        - basePrice
        - currency
        - stripeProductId
        - stripePriceId
      filter:
        CourseInstructors:
          User:
            id:
              _eq: X-Hasura-User-Id
      check: null
  # Org admins may edit a course only if they have the capability matching the type of the
  # program the course belongs to. programId is not editable, so a course cannot be moved into a
  # program (type/org) outside the admin's scope.
  - role: org_admin_access
    permission:
      columns:
        - achievementCertificateTemplateId
        - attendanceCertificateTemplateId
        - chatLink
        - contentDescriptionField1
        - contentDescriptionField2
        - coverImage
        - ects
        - requiredEcts
        - requiredEventCount
        - endTime
        - headingDescriptionField1
        - headingDescriptionField2
        - language
        - learningGoals
        - maxMissedSessions
        - maxParticipants
        - projectProposalsEnabled
        - projectSubmissionDeadline
        - startTime
        - status
        - tagline
        - title
        - weekDay
        - formbricksEnrollmentSurveyUrl
        - basePrice
        - currency
        - stripeProductId
        - stripePriceId
        - published
        - applicationEnd
        - cost
        - externalRegistrationLink
      filter:
        _or:
          - Program:
              _and:
                - type:
                    _eq: EVENTS
                - Organization:
                    OrganizationAdmins:
                      _and:
                        - userId:
                            _eq: X-Hasura-User-Id
                        - canManageEvents:
                            _eq: true
          - Program:
              _and:
                - type:
                    _eq: COURSES
                - Organization:
                    OrganizationAdmins:
                      _and:
                        - userId:
                            _eq: X-Hasura-User-Id
                        - canManageCourses:
                            _eq: true
          - Program:
              _and:
                - type:
                    _eq: DEGREES
                - Organization:
                    OrganizationAdmins:
                      _and:
                        - userId:
                            _eq: X-Hasura-User-Id
                        - canManageDegrees:
                            _eq: true
          # A settings admin manages every program type for their organization (no type constraint).
          - Program:
              Organization:
                OrganizationAdmins:
                  _and:
                    - userId:
                        _eq: X-Hasura-User-Id
                    - canManageSettings:
                        _eq: true
      check:
        _or:
          - Program:
              _and:
                - type:
                    _eq: EVENTS
                - Organization:
                    OrganizationAdmins:
                      _and:
                        - userId:
                            _eq: X-Hasura-User-Id
                        - canManageEvents:
                            _eq: true
          - Program:
              _and:
                - type:
                    _eq: COURSES
                - Organization:
                    OrganizationAdmins:
                      _and:
                        - userId:
                            _eq: X-Hasura-User-Id
                        - canManageCourses:
                            _eq: true
          - Program:
              _and:
                - type:
                    _eq: DEGREES
                - Organization:
                    OrganizationAdmins:
                      _and:
                        - userId:
                            _eq: X-Hasura-User-Id
                        - canManageDegrees:
                            _eq: true
          # A settings admin manages every program type for their organization (no type constraint).
          - Program:
              Organization:
                OrganizationAdmins:
                  _and:
                    - userId:
                        _eq: X-Hasura-User-Id
                    - canManageSettings:
                        _eq: true
