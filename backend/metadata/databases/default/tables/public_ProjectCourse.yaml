table:
  name: ProjectCourse
  schema: public
object_relationships:
  - name: Course
    using:
      foreign_key_constraint_on: courseId
  - name: Project
    using:
      foreign_key_constraint_on: projectId
insert_permissions:
  # Students self-proposing a course project: INSERT_SELF_PROPOSED_PROJECT nests ProjectCourses.
  - role: user_access
    permission:
      check:
        _and:
          - Course:
              CourseEnrollments:
                User:
                  id:
                    _eq: X-Hasura-User-Id
          - Project:
              proposedByUserId:
                _eq: X-Hasura-User-Id
              status:
                _eq: PROPOSED
      columns:
        - courseId
        - projectId
  - role: instructor_access
    permission:
      check:
        _and:
          - Course:
              CourseInstructors:
                User:
                  id:
                    _eq: X-Hasura-User-Id
          - Project:
              _or:
                - proposedByUserId:
                    _eq: X-Hasura-User-Id
                - Organization:
                    OrganizationAdmins:
                      userId:
                        _eq: X-Hasura-User-Id
      columns:
        - courseId
        - created_at
        - id
        - projectId
        - updated_at
  # Explicit override for the inherited `instructor` role: instructor_access and user_access
  # define different checks and column sets for this insert, and Hasura cannot merge differing
  # insert permissions. Defining the permission directly on `instructor` overrides the inherited
  # merge and pins the role to exactly the instructor_access behaviour above. Keep both in sync.
  - role: instructor
    permission:
      check:
        _and:
          - Course:
              CourseInstructors:
                User:
                  id:
                    _eq: X-Hasura-User-Id
          - Project:
              _or:
                - proposedByUserId:
                    _eq: X-Hasura-User-Id
                - Organization:
                    OrganizationAdmins:
                      userId:
                        _eq: X-Hasura-User-Id
      columns:
        - courseId
        - created_at
        - id
        - projectId
        - updated_at
  # The project is bound as well as the course: otherwise whoever manages a course could link another organization's project to it and reach it through ProjectCourses.
  - role: org_admin_access
    permission:
      check:
        _and:
          - Course:
              Program:
                _or:
                  - _and:
                      - type:
                          _eq: EVENTS
                      - Organization:
                          OrganizationAdmins:
                            _and:
                              - userId:
                                  _eq: X-Hasura-User-Id
                              - canManageEvents:
                                  _eq: true
                  - _and:
                      - type:
                          _eq: COURSES
                      - Organization:
                          OrganizationAdmins:
                            _and:
                              - userId:
                                  _eq: X-Hasura-User-Id
                              - canManageCourses:
                                  _eq: true
                  - _and:
                      - type:
                          _eq: DEGREES
                      - Organization:
                          OrganizationAdmins:
                            _and:
                              - userId:
                                  _eq: X-Hasura-User-Id
                              - canManageDegrees:
                                  _eq: true
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageSettings:
                              _eq: true
          - Project:
              _or:
                - proposedByUserId:
                    _eq: X-Hasura-User-Id
                - Organization:
                    OrganizationAdmins:
                      userId:
                        _eq: X-Hasura-User-Id
      columns:
        - courseId
        - created_at
        - id
        - projectId
        - updated_at
select_permissions:
  # Public: needed so logged-out visitors can read the course context of a
  # publicly-visible project (course line on tiles, course card, group filters,
  # past-courses-in-series). Mirrors the Project anonymous visibility rule.
  - role: anonymous
    permission:
      columns:
        - courseId
        - created_at
        - id
        - projectId
        - updated_at
      filter:
        Project:
          _or:
            - published:
                _eq: true
            - _and:
                - status:
                    _eq: PROPOSED
                - _not:
                    ProjectAuthors:
                      participationStatus:
                        _eq: ACCEPTED
  - role: instructor_access
    permission:
      columns:
        - courseId
        - created_at
        - id
        - projectId
        - updated_at
      filter:
        Course:
          CourseInstructors:
            User:
              id:
                _eq: X-Hasura-User-Id
  - role: user_access
    permission:
      columns:
        - courseId
        - created_at
        - id
        - projectId
        - updated_at
      filter:
        Course:
          CourseEnrollments:
            User:
              id:
                _eq: X-Hasura-User-Id
  - role: org_admin_access
    permission:
      columns:
        - courseId
        - created_at
        - id
        - projectId
        - updated_at
      filter:
        Course:
          Program:
            _or:
              - _and:
                  - type:
                      _eq: EVENTS
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageEvents:
                              _eq: true
              - _and:
                  - type:
                      _eq: COURSES
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageCourses:
                              _eq: true
              - _and:
                  - type:
                      _eq: DEGREES
                  - Organization:
                      OrganizationAdmins:
                        _and:
                          - userId:
                              _eq: X-Hasura-User-Id
                          - canManageDegrees:
                              _eq: true
              - Organization:
                  OrganizationAdmins:
                    _and:
                      - userId:
                          _eq: X-Hasura-User-Id
                      - canManageSettings:
                          _eq: true
update_permissions:
  - role: instructor_access
    permission:
      columns:
        - courseId
        - projectId
      filter: &id001
        Course:
          CourseInstructors:
            User:
              id:
                _eq: X-Hasura-User-Id
      check:
        _and:
          - *id001
          - Project:
              _or:
                - proposedByUserId:
                    _eq: X-Hasura-User-Id
                - Organization:
                    OrganizationAdmins:
                      userId:
                        _eq: X-Hasura-User-Id
delete_permissions:
  - role: instructor_access
    permission:
      filter:
        Course:
          CourseInstructors:
            User:
              id:
                _eq: X-Hasura-User-Id
