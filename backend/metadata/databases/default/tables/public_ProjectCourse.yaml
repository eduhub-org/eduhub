table:
  name: ProjectCourse
  schema: public
object_relationships:
  - name: Course
    using:
      foreign_key_constraint_on: courseId
  - name: Project
    using:
      foreign_key_constraint_on: projectId
insert_permissions:
  - role: instructor_access
    permission:
      check:
        Course:
          CourseInstructors:
            User:
              id:
                _eq: X-Hasura-User-Id
      columns:
        - courseId
        - created_at
        - id
        - projectId
        - updated_at
select_permissions:
  - role: instructor_access
    permission:
      columns:
        - courseId
        - created_at
        - id
        - projectId
        - updated_at
      filter:
        Course:
          CourseInstructors:
            User:
              id:
                _eq: X-Hasura-User-Id
  - role: user_access
    permission:
      columns:
        - courseId
        - created_at
        - id
        - projectId
        - updated_at
      filter:
        Course:
          CourseEnrollments:
            User:
              id:
                _eq: X-Hasura-User-Id
update_permissions:
  - role: instructor_access
    permission:
      columns:
        - courseId
        - projectId
      filter:
        Course:
          CourseInstructors:
            User:
              id:
                _eq: X-Hasura-User-Id
      check:
        Course:
          CourseInstructors:
            User:
              id:
                _eq: X-Hasura-User-Id
delete_permissions:
  - role: instructor_access
    permission:
      filter:
        Course:
          CourseInstructors:
            User:
              id:
                _eq: X-Hasura-User-Id
