table:
  name: ProjectCourse
  schema: public
object_relationships:
  - name: Course
    using:
      foreign_key_constraint_on: courseId
  - name: Project
    using:
      foreign_key_constraint_on: projectId
insert_permissions:
  # Students self-proposing a course project: INSERT_SELF_PROPOSED_PROJECT nests ProjectCourses.
  - role: user_access
    permission:
      check:
        _and:
          - Course:
              CourseEnrollments:
                User:
                  id:
                    _eq: X-Hasura-User-Id
          - Project:
              proposedByUserId:
                _eq: X-Hasura-User-Id
              status:
                _eq: PROPOSED
      columns:
        - courseId
        - projectId
  - role: instructor_access
    permission:
      check:
        Course:
          CourseInstructors:
            User:
              id:
                _eq: X-Hasura-User-Id
      columns:
        - courseId
        - created_at
        - id
        - projectId
        - updated_at
select_permissions:
  # Public: needed so logged-out visitors can read the course context of a
  # publicly-visible project (course line on tiles, course card, group filters,
  # past-courses-in-series). Mirrors the Project anonymous visibility rule.
  - role: anonymous
    permission:
      columns:
        - courseId
        - created_at
        - id
        - projectId
        - updated_at
      filter:
        Project:
          _or:
            - published:
                _eq: true
            - _and:
                - status:
                    _eq: PROPOSED
                - _not:
                    ProjectAuthors:
                      participationStatus:
                        _eq: ACCEPTED
  - role: instructor_access
    permission:
      columns:
        - courseId
        - created_at
        - id
        - projectId
        - updated_at
      filter:
        Course:
          CourseInstructors:
            User:
              id:
                _eq: X-Hasura-User-Id
  - role: user_access
    permission:
      columns:
        - courseId
        - created_at
        - id
        - projectId
        - updated_at
      filter:
        Course:
          CourseEnrollments:
            User:
              id:
                _eq: X-Hasura-User-Id
update_permissions:
  - role: instructor_access
    permission:
      columns:
        - courseId
        - projectId
      filter:
        Course:
          CourseInstructors:
            User:
              id:
                _eq: X-Hasura-User-Id
      check:
        Course:
          CourseInstructors:
            User:
              id:
                _eq: X-Hasura-User-Id
delete_permissions:
  - role: instructor_access
    permission:
      filter:
        Course:
          CourseInstructors:
            User:
              id:
                _eq: X-Hasura-User-Id
