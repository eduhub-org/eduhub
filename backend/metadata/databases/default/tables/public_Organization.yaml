table:
  name: Organization
  schema: public
object_relationships:
  - name: Country
    using:
      foreign_key_constraint_on: country
  # The settings-admin-only columns (billing, tax, integration credentials) live in the
  # OrganizationSettings view, whose own permission requires canManageSettings. Reading them
  # through this relationship yields null for an admin without that capability.
  - name: Settings
    using:
      manual_configuration:
        column_mapping:
          id: id
        insertion_order: null
        remote_table:
          name: OrganizationSettings
          schema: public
  - name: OrganizationType
    using:
      foreign_key_constraint_on: type
array_relationships:
  - name: FundedCourses
    using:
      foreign_key_constraint_on:
        column: organizationId
        table:
          name: CourseFundingOrganization
          schema: public
  - name: OrganizationAdmins
    using:
      foreign_key_constraint_on:
        column: organizationId
        table:
          name: OrganizationAdmin
          schema: public
  - name: Users
    using:
      foreign_key_constraint_on:
        column: organizationId
        table:
          name: User
          schema: public
  - name: Programs
    using:
      foreign_key_constraint_on:
        column: organizationId
        table:
          name: Program
          schema: public
  - name: Projects
    using:
      foreign_key_constraint_on:
        column: organizationId
        table:
          name: Project
          schema: public
  - name: OrganizationNewsletterSubscriptions
    using:
      foreign_key_constraint_on:
        column: organizationId
        table:
          name: OrganizationNewsletterSubscription
          schema: public
  - name: JobPostings
    using:
      foreign_key_constraint_on:
        column: organizationId
        table:
          name: JobPosting
          schema: public
  - name: JobPostingCredits
    using:
      foreign_key_constraint_on:
        column: organizationId
        table:
          name: JobPostingCredit
          schema: public
  - name: JobPortals
    using:
      foreign_key_constraint_on:
        column: organizationId
        table:
          name: JobPortal
          schema: public
insert_permissions:
  - role: user_access
    permission:
      check: {}
      columns:
        - addressLine1
        - addressLine2
        - aliases
        - bankName
        - city
        - country
        - created_at
        - defaultTaxExemptionNote
        - defaultVatRate
        - description
        - email
        - id
        - invoiceFooterText
        - invoiceNumberPrefix
        - legalForm
        - legalName
        - logo
        - managingDirector
        - name
        - newsletterDescription
        - newsletterProvider
        - phone
        - postalCode
        - registerCourt
        - registerNumber
        - ghostNewsletterApiUrl
        - ghostNewsletterListId
        - ghostNewsletterSlug
        - ghostNewsletterLabel
        - ghostNewsletterDoubleOptInEnabled
        - taxNumber
        - type
        - updated_at
        - vatId
        - website
select_permissions:
  - role: anonymous
    permission:
      columns:
        - aliases
        - created_at
        - description
        - ghostNewsletterApiUrl
        - ghostNewsletterDoubleOptInEnabled
        - ghostNewsletterLabel
        - ghostNewsletterListId
        - ghostNewsletterSlug
        - id
        - logo
        - name
        - newsletterDescription
        - newsletterProvider
        - type
        - updated_at
        # website and city are public on the StuJo employer profile pages
        - website
        - city
      filter: {}
      allow_aggregations: true
  # Org admins may read the working record of any organization they administer (regardless of which
  # capability flags are set) so they have context for managing it.
  #
  # The banking, tax, register and invoicing columns and the integration credentials are NOT here:
  # this filter is satisfied by any grant, so a job-board-only admin would read them too. They live
  # in the OrganizationSettings view (relationship `Settings`), which requires canManageSettings —
  # the same capability the update permission below requires to change them. The Ghost newsletter
  # endpoint fields stay because `anonymous` may already read them; hiding them here would protect
  # nothing. The `user` role only sees the public columns granted to `anonymous`.
  - role: org_admin_access
    permission:
      columns:
        - addressLine1
        - addressLine2
        - aliases
        - city
        - country
        - created_at
        - description
        - email
        - id
        - logo
        - name
        - newsletterDescription
        - newsletterProvider
        - phone
        - postalCode
        - ghostNewsletterApiUrl
        - ghostNewsletterListId
        - ghostNewsletterSlug
        - ghostNewsletterLabel
        - ghostNewsletterDoubleOptInEnabled
        - type
        - updated_at
        - website
      filter:
        OrganizationAdmins:
          userId:
            _eq: X-Hasura-User-Id
      allow_aggregations: true
update_permissions:
  # Editing an organization's settings (logo, name, API key, branding, invoice/billing data)
  # requires the canManageSettings capability on the admin's OrganizationAdmin row for that org.
  # `type` and `id` are intentionally excluded so an org admin cannot reassign the record.
  - role: org_admin_access
    permission:
      columns:
        - addressLine1
        - addressLine2
        - aliases
        - bankName
        - city
        - country
        - defaultTaxExemptionNote
        - defaultVatRate
        - description
        - email
        - invoiceFooterText
        - invoiceNumberPrefix
        - legalForm
        - legalName
        - logo
        - managingDirector
        - name
        - newsletterDescription
        - newsletterProvider
        - phone
        - postalCode
        - registerCourt
        - registerNumber
        - ghostNewsletterApiUrl
        - ghostNewsletterListId
        - ghostNewsletterSlug
        - ghostNewsletterLabel
        - ghostNewsletterDoubleOptInEnabled
        - apiKeyHash
        - taxNumber
        - vatId
        - website
      filter:
        OrganizationAdmins:
          _and:
            - userId:
                _eq: X-Hasura-User-Id
            - canManageSettings:
                _eq: true
      check: null
