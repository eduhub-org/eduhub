        - id
        - invoiceFooterText
        - invoiceNumberPrefix
        - legalForm
        - legalName
        - logo
        - managingDirector
        - name
        - phone
        - postalCode
        - registerCourt
        - registerNumber
        - stripePublishableKey
        - stripeSecretKey
        - stripeWebhookSecret
        - taxNumber
        - type
        - updated_at
        - vatId
        - website
select_permissions:
