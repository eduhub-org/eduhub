table:
  name: Organization
  schema: public
object_relationships:
  - name: Country
    using:
      foreign_key_constraint_on: country
  - name: OrganizationType
    using:
      foreign_key_constraint_on: type
array_relationships:
  - name: FundedCourses
    using:
      foreign_key_constraint_on:
        column: organizationId
        table:
          name: CourseFundingOrganization
          schema: public
  - name: OrganizationAdmins
    using:
      foreign_key_constraint_on:
        column: organizationId
        table:
          name: OrganizationAdmin
          schema: public
  - name: Users
    using:
      foreign_key_constraint_on:
        column: organizationId
        table:
          name: User
          schema: public
  - name: Programs
    using:
      foreign_key_constraint_on:
        column: organizationId
        table:
          name: Program
          schema: public
  - name: Projects
    using:
      foreign_key_constraint_on:
        column: organizationId
        table:
          name: Project
          schema: public
  - name: OrganizationNewsletterSubscriptions
    using:
      foreign_key_constraint_on:
        column: organizationId
        table:
          name: OrganizationNewsletterSubscription
          schema: public
insert_permissions:
  - role: user_access
    permission:
      check: {}
      columns:
        - addressLine1
        - addressLine2
        - aliases
        - bankName
        - city
        - country
        - created_at
        - defaultTaxExemptionNote
        - defaultVatRate
        - description
        - email
        - id
        - invoiceFooterText
        - invoiceNumberPrefix
        - legalForm
        - legalName
        - logo
        - managingDirector
        - name
        - newsletterDescription
        - newsletterProvider
        - phone
        - postalCode
        - registerCourt
        - registerNumber
        - ghostNewsletterApiUrl
        - ghostNewsletterListId
        - ghostNewsletterSlug
        - ghostNewsletterLabel
        - ghostNewsletterDoubleOptInEnabled
        - taxNumber
        - type
        - updated_at
        - vatId
        - website
select_permissions:
  - role: api_proxy
    permission:
      columns:
        - aliases
        - description
        - id
        - logo
        - name
        - type
      filter: {}
  - role: anonymous
    permission:
      columns:
        - aliases
        - created_at
        - description
        - ghostNewsletterApiUrl
        - ghostNewsletterDoubleOptInEnabled
        - ghostNewsletterLabel
        - ghostNewsletterListId
        - ghostNewsletterSlug
        - id
        - logo
        - name
        - newsletterDescription
        - newsletterProvider
        - type
        - updated_at
      filter: {}
      allow_aggregations: true
  # Org admins may read the full record of any organization they administer (regardless of which
  # capability flags are set) so they have context for managing it. Editing settings additionally
  # requires canManageSettings (see update_permissions). The `user` role only sees the public
  # columns granted to `anonymous`.
  - role: org_admin_access
    permission:
      columns:
        - addressLine1
        - addressLine2
        - aliases
        - bankName
        - city
        - country
        - created_at
        - defaultTaxExemptionNote
        - defaultVatRate
        - description
        - email
        - id
        - invoiceFooterText
        - invoiceNumberPrefix
        - legalForm
        - legalName
        - logo
        - managingDirector
        - name
        - newsletterDescription
        - newsletterProvider
        - phone
        - postalCode
        - registerCourt
        - registerNumber
        - ghostNewsletterApiUrl
        - ghostNewsletterApiKeyConfigured
        - ghostNewsletterListId
        - ghostNewsletterSlug
        - ghostNewsletterLabel
        - ghostNewsletterDoubleOptInEnabled
        - apiKeyHash
        - taxNumber
        - type
        - updated_at
        - vatId
        - website
      filter:
        OrganizationAdmins:
          userId:
            _eq: X-Hasura-User-Id
      allow_aggregations: true
update_permissions:
  # Editing an organization's settings (logo, name, API key, branding, invoice/billing data)
  # requires the canManageSettings capability on the admin's OrganizationAdmin row for that org.
  # `type` and `id` are intentionally excluded so an org admin cannot reassign the record.
  - role: org_admin_access
    permission:
      columns:
        - addressLine1
        - addressLine2
        - aliases
        - bankName
        - city
        - country
        - defaultTaxExemptionNote
        - defaultVatRate
        - description
        - email
        - invoiceFooterText
        - invoiceNumberPrefix
        - legalForm
        - legalName
        - logo
        - managingDirector
        - name
        - newsletterDescription
        - newsletterProvider
        - phone
        - postalCode
        - registerCourt
        - registerNumber
        - ghostNewsletterApiUrl
        - ghostNewsletterListId
        - ghostNewsletterSlug
        - ghostNewsletterLabel
        - ghostNewsletterDoubleOptInEnabled
        - apiKeyHash
        - taxNumber
        - vatId
        - website
      filter:
        OrganizationAdmins:
          _and:
            - userId:
                _eq: X-Hasura-User-Id
            - canManageSettings:
                _eq: true
      check: null
