table:
  name: Organization
  schema: public
object_relationships:
  - name: Country
    using:
      foreign_key_constraint_on: country
  - name: OrganizationType
    using:
      foreign_key_constraint_on: type
array_relationships:
  - name: FundedCourses
    using:
      foreign_key_constraint_on:
        column: organizationId
        table:
          name: CourseFundingOrganization
          schema: public
  - name: OrganizationAdmins
    using:
      foreign_key_constraint_on:
        column: organizationId
        table:
          name: OrganizationAdmin
          schema: public
  - name: Users
    using:
      foreign_key_constraint_on:
        column: organizationId
        table:
          name: User
          schema: public
  - name: Programs
    using:
      foreign_key_constraint_on:
        column: organizationId
        table:
          name: Program
          schema: public
insert_permissions:
  - role: user_access
    permission:
      check: {}
      columns:
        - addressLine1
        - addressLine2
        - aliases
        - apiKeyHash
        - bankBic
        - bankIban
        - bankName
        - city
        - country
        - created_at
        - defaultTaxExemptionNote
        - defaultVatRate
        - description
        - email
        - formbricksApiKey
