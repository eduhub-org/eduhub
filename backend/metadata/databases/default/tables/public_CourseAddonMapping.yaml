table:
  name: CourseAddonMapping
  schema: public
object_relationships:
  - name: Course
    using:
      foreign_key_constraint_on: courseId
  - name: User
    using:
      foreign_key_constraint_on: validatedBy
select_permissions:
  - role: instructor_access
    permission:
      columns:
        - id
        - courseId
        - questionId
        - questionTextDe
        - questionTextEn
        - extractedPrice
        - validatedPrice
        - currency
        - description
        - stripeProductId
        - stripePriceId
        - confidence
        - validatedAt
        - validatedBy
        - created_at
        - updated_at
      filter: {}
  - role: user_access
    permission:
      columns:
        - id
        - courseId
        - questionId
        - description
        - validatedPrice
        - currency
      filter:
        Course:
          published:
            _eq: true
insert_permissions:
  - role: instructor_access
    permission:
      check: {}
      columns:
        - courseId
        - questionId
        - questionTextDe
        - questionTextEn
        - extractedPrice
        - validatedPrice
        - currency
        - description
        - stripeProductId
        - stripePriceId
        - confidence
        - validatedAt
        - validatedBy
update_permissions:
  - role: instructor_access
    permission:
      columns:
        - validatedPrice
        - currency
        - description
        - stripeProductId
        - stripePriceId
        - confidence
        - validatedAt
        - validatedBy
      filter: {}
      check: {}
delete_permissions:
  - role: instructor_access
    permission:
      filter: {}

