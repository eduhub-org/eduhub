table:
  name: Project
  schema: public
object_relationships:
  - name: Organization
    using:
      foreign_key_constraint_on: organizationId
  - name: ParentProject
    using:
      foreign_key_constraint_on: parentProjectId
  - name: ProjectAchievementCertificateType
    using:
      foreign_key_constraint_on: achievementCertificateType
  - name: ProjectDocumentationTemplate
    using:
      foreign_key_constraint_on: documentationTemplateId
  - name: ProjectRating
    using:
      foreign_key_constraint_on: rating
  - name: ProjectStatus
    using:
      foreign_key_constraint_on: status
  - name: ProjectType
    using:
      foreign_key_constraint_on: type
  - name: ProposedByUser
    using:
      foreign_key_constraint_on: proposedByUserId
array_relationships:
  - name: ChildProjects
    using:
      foreign_key_constraint_on:
        column: parentProjectId
        table:
          name: Project
          schema: public
  - name: ProjectAuthors
    using:
      foreign_key_constraint_on:
        column: projectId
        table:
          name: ProjectAuthor
          schema: public
  - name: ProjectCourses
    using:
      foreign_key_constraint_on:
        column: projectId
        table:
          name: ProjectCourse
          schema: public
  - name: ProjectMentors
    using:
      foreign_key_constraint_on:
        column: projectId
        table:
          name: ProjectMentor
          schema: public
insert_permissions:
  - role: user_access
    permission:
      check:
        proposedByUserId:
          _eq: X-Hasura-User-Id
      columns:
        - achievementCertificateType
        - acceptingParticipants
        - coverImageUrl
        - description
        - documentationTemplateId
        - documentationUrl
        - externalUrl
        - id
        - organizationId
        - parentProjectId
        - presentationUrl
        - proposedByUserId
        - status
        - tagline
        - title
        - type
select_permissions:
  - role: anonymous
    permission:
      columns:
        - acceptingParticipants
        - achievementCertificateType
        - coverImageUrl
        - description
        - documentationUrl
        - externalUrl
        - id
        - organizationId
        - presentationUrl
        - status
        - tagline
        - title
        - type
      filter:
        status:
          _eq: PUBLISHED
  - role: instructor_access
    permission:
      columns:
        - acceptingParticipants
        - achievementCertificateType
        - coverImageUrl
        - created_at
        - csvResults
        - description
        - documentationTemplateId
        - documentationUrl
        - evaluationScriptUrl
        - externalUrl
        - id
        - organizationId
        - parentProjectId
        - presentationUrl
        - proposedByUserId
        - rating
        - score
        - status
        - tagline
        - title
        - type
        - updated_at
      filter:
        _or:
          - ProjectCourses:
              Course:
                CourseInstructors:
                  User:
                    id:
                      _eq: X-Hasura-User-Id
          - ProjectMentors:
              User:
                id:
                  _eq: X-Hasura-User-Id
  - role: user_access
    permission:
      columns:
        - acceptingParticipants
        - achievementCertificateType
        - coverImageUrl
        - created_at
        - csvResults
        - description
        - documentationTemplateId
        - documentationUrl
        - evaluationScriptUrl
        - externalUrl
        - id
        - organizationId
        - parentProjectId
        - presentationUrl
        - proposedByUserId
        - rating
        - score
        - status
        - tagline
        - title
        - type
        - updated_at
      filter:
        _or:
          - status:
              _eq: PROPOSED
          - ProjectAuthors:
              User:
                id:
                  _eq: X-Hasura-User-Id
          - proposedByUserId:
              _eq: X-Hasura-User-Id
update_permissions:
  - role: user_access
    permission:
      columns:
        - acceptingParticipants
        - achievementCertificateType
        - coverImageUrl
        - description
        - documentationTemplateId
        - documentationUrl
        - externalUrl
        - presentationUrl
        - rating
        - score
        - status
        - tagline
        - title
        - type
      filter:
        _or:
          - ProjectCourses:
              Course:
                CourseInstructors:
                  User:
                    id:
                      _eq: X-Hasura-User-Id
          - ProjectMentors:
              User:
                id:
                  _eq: X-Hasura-User-Id
          - _and:
              - status:
                  _in:
                    - PROPOSED
                    - ONGOING
              - ProjectAuthors:
                  _and:
                    - participationStatus:
                        _eq: ACCEPTED
                    - User:
                        id:
                          _eq: X-Hasura-User-Id
      check: {}
delete_permissions:
  - role: instructor_access
    permission:
      filter:
        _or:
          - ProjectCourses:
              Course:
                CourseInstructors:
                  User:
                    id:
                      _eq: X-Hasura-User-Id
          - ProjectMentors:
              User:
                id:
                  _eq: X-Hasura-User-Id
