table:
  name: Project
  schema: public
object_relationships:
  - name: Organization
    using:
      foreign_key_constraint_on: organizationId
  - name: ParentProject
    using:
      foreign_key_constraint_on: parentProjectId
  - name: ProjectDocumentationInstruction
    using:
      foreign_key_constraint_on: documentationInstructionId
  - name: ProjectRating
    using:
      foreign_key_constraint_on: rating
  - name: ProjectStatus
    using:
      foreign_key_constraint_on: status
  - name: ProjectType
    using:
      foreign_key_constraint_on: type
  - name: ProposedByUser
    using:
      foreign_key_constraint_on: proposedByUserId
  - name: SubmittedByUser
    using:
      foreign_key_constraint_on: submittedBy
array_relationships:
  - name: ChildProjects
    using:
      foreign_key_constraint_on:
        column: parentProjectId
        table:
          name: Project
          schema: public
  - name: ProjectAuthors
    using:
      foreign_key_constraint_on:
        column: projectId
        table:
          name: ProjectAuthor
          schema: public
  - name: ProjectBadges
    using:
      foreign_key_constraint_on:
        column: projectId
        table:
          name: ProjectBadge
          schema: public
  - name: ProjectCourses
    using:
      foreign_key_constraint_on:
        column: projectId
        table:
          name: ProjectCourse
          schema: public
  - name: ProjectConsentEvents
    using:
      foreign_key_constraint_on:
        column: projectId
        table:
          name: ProjectConsentEvent
          schema: public
  - name: ProjectGroups
    using:
      foreign_key_constraint_on:
        column: projectId
        table:
          name: ProjectGroup
          schema: public
  - name: ProjectMentors
    using:
      foreign_key_constraint_on:
        column: projectId
        table:
          name: ProjectMentor
          schema: public
insert_permissions:
  - role: user_access
    permission:
      check:
        _and:
          - proposedByUserId:
              _eq: X-Hasura-User-Id
          - status:
              _eq: PROPOSED
      columns:
        - acceptingParticipants
        - coverImageUrl
        - description
        - documentationInstructionId
        - documentationUrl
        - externalUrl
        - organizationId
        - parentProjectId
        - presentationUrl
        - proposedByUserId
        - status
        - tagline
        - title
        - type
  # Same rules as user_access self-propose. Both roles define this insert identically and neither
  # uses a preset, so Hasura merges them cleanly for the inherited `instructor` role and no
  # explicit `- role: instructor` override is needed here (unlike Project update below).
  - role: instructor_access
    permission:
      check:
        _and:
          - proposedByUserId:
              _eq: X-Hasura-User-Id
          - status:
              _eq: PROPOSED
      columns:
        - acceptingParticipants
        - coverImageUrl
        - description
        - documentationInstructionId
        - documentationUrl
        - externalUrl
        - organizationId
        - parentProjectId
        - presentationUrl
        - proposedByUserId
        - status
        - tagline
        - title
        - type
select_permissions:
  - role: anonymous
    permission:
      columns:
        - acceptingParticipants
        - coverImageUrl
        - description
        - documentationInstructionId
        - documentationUrl
        - externalUrl
        - id
        - organizationId
        - presentationUrl
        - published
        - status
        - submissionDeadline
        - submittedAt
        - tagline
        - title
        - type
        # Required for public project-slider ordering (order_by: updated_at desc).
        - updated_at
      filter:
        _or:
          - published:
              _eq: true
          - _and:
              - status:
                  _eq: PROPOSED
              - _not:
                  ProjectAuthors:
                    participationStatus:
                      _eq: ACCEPTED
  - role: instructor_access
    permission:
      columns:
        - acceptingParticipants
        - coverImageUrl
        - created_at
        - csvResults
        - description
        - documentationInstructionId
        - documentationUrl
        - externalUrl
        - id
        - organizationId
        - parentProjectId
        - presentationUrl
        - proposedByUserId
        - published
        - rating
        - ratingComment
        - status
        - submissionDeadline
        - submittedAt
        - sentBackAt
        - submittedBy
        - suggestedForPublication
        - projectReviewRequestedAt
        - tagline
        - title
        - type
        - updated_at
      filter:
        _or:
          - ProjectCourses:
              Course:
                CourseInstructors:
                  User:
                    id:
                      _eq: X-Hasura-User-Id
          - ProjectMentors:
              User:
                id:
                  _eq: X-Hasura-User-Id
  - role: user_access
    permission:
      columns:
        - acceptingParticipants
        - coverImageUrl
        - created_at
        - csvResults
        - description
        - documentationInstructionId
        - documentationUrl
        - externalUrl
        - id
        - organizationId
        - parentProjectId
        - presentationUrl
        - proposedByUserId
        - published
        - rating
        - ratingComment
        - status
        - submissionDeadline
        - submittedAt
        - sentBackAt
        - submittedBy
        - suggestedForPublication
        - projectReviewRequestedAt
        - tagline
        - title
        - type
        - updated_at
      filter:
        _or:
          - ProjectAuthors:
              User:
                id:
                  _eq: X-Hasura-User-Id
          - proposedByUserId:
              _eq: X-Hasura-User-Id
          - ProjectCourses:
              Course:
                CourseEnrollments:
                  User:
                    id:
                      _eq: X-Hasura-User-Id
update_permissions:
  # Covers grading plus the same project fields instructors previously reached via merged user_access.
  - role: instructor_access
    permission:
      columns:
        - acceptingParticipants
        - coverImageUrl
        - description
        - documentationInstructionId
        - documentationUrl
        - externalUrl
        - presentationUrl
        - rating
        - ratingComment
        - status
        - submissionDeadline
        - tagline
        - title
        - type
        - suggestedForPublication
      filter:
        _or:
          - ProjectCourses:
              Course:
                CourseInstructors:
                  User:
                    id:
                      _eq: X-Hasura-User-Id
          - ProjectMentors:
              User:
                id:
                  _eq: X-Hasura-User-Id
          - _and:
              - status:
                  _in:
                    - PROPOSED
                    - ONGOING
              - ProjectAuthors:
                  _and:
                    - participationStatus:
                        _eq: ACCEPTED
                    - User:
                        id:
                          _eq: X-Hasura-User-Id
      check:
        _or:
          - suggestedForPublication:
              _eq: false
          - status:
              _in:
                - COMPLETED
  # submittedBy is populated only via the server-side preset below; clients cannot write it.
  # The set_project_submitted_metadata trigger clears submittedBy when status transitions out of SUBMITTED.
  - role: user_access
    permission:
      columns:
        - acceptingParticipants
        - coverImageUrl
        - description
        - documentationInstructionId
        - documentationUrl
        - externalUrl
        - presentationUrl
        - status
        - tagline
        - projectReviewRequestedAt
        - title
        - type
      set:
        submittedBy: x-hasura-user-id
      filter:
        _or:
          - ProjectCourses:
              Course:
                CourseInstructors:
                  User:
                    id:
                      _eq: X-Hasura-User-Id
          - ProjectMentors:
              User:
                id:
                  _eq: X-Hasura-User-Id
          - _and:
              - status:
                  _in:
                    - PROPOSED
                    - ONGOING
              - ProjectAuthors:
                  _and:
                    - participationStatus:
                        _eq: ACCEPTED
                    - User:
                        id:
                          _eq: X-Hasura-User-Id
      check: {}
  # Explicit override for the inherited `instructor` role: user_access carries a
  # `set: submittedBy` preset that instructor_access does not, and Hasura cannot merge that pair.
  # Defining the permission directly on `instructor` overrides the inherited merge and pins the
  # role to exactly the instructor_access behaviour above. Keep both rules in sync.
  - role: instructor
    permission:
      columns:
        - acceptingParticipants
        - coverImageUrl
        - description
        - documentationInstructionId
        - documentationUrl
        - externalUrl
        - presentationUrl
        - rating
        - ratingComment
        - status
        - submissionDeadline
        - tagline
        - title
        - type
        - suggestedForPublication
      filter:
        _or:
          - ProjectCourses:
              Course:
                CourseInstructors:
                  User:
                    id:
                      _eq: X-Hasura-User-Id
          - ProjectMentors:
              User:
                id:
                  _eq: X-Hasura-User-Id
          - _and:
              - status:
                  _in:
                    - PROPOSED
                    - ONGOING
              - ProjectAuthors:
                  _and:
                    - participationStatus:
                        _eq: ACCEPTED
                    - User:
                        id:
                          _eq: X-Hasura-User-Id
      check:
        _or:
          - suggestedForPublication:
              _eq: false
          - status:
              _in:
                - COMPLETED
delete_permissions:
  - role: instructor_access
    permission:
      filter:
        _or:
          - ProjectCourses:
              Course:
                CourseInstructors:
                  User:
                    id:
                      _eq: X-Hasura-User-Id
          - ProjectMentors:
              User:
                id:
                  _eq: X-Hasura-User-Id
event_triggers:
  - name: send_project_status_email
    definition:
      enable_manual: true
      update:
        columns:
          - status
    retry_conf:
      interval_sec: 3660
      num_retries: 10
      timeout_sec: 600
    webhook: '{{CLOUD_FUNCTION_LINK_CALL_NODE_FUNCTION}}'
    headers:
      - name: name
        value: sendProjectEmail
      - name: secret
        value_from_env: HASURA_CLOUD_FUNCTION_SECRET
